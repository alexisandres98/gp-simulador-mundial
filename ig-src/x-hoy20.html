<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #07271B 0%, #0A5C3C 55%, #0BA661 125%); color: #fff;
  padding: 40px 56px; position: relative; }
.brand { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
.badge { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid rgba(255,255,255,.25); }
.bname { font-size: 21px; font-weight: 800; }
.tag { margin-left: auto; background: rgba(229,72,77,.95); font-weight: 800; font-size: 14px; padding: 8px 16px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.m { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 20px 22px; }
.m.star { background: rgba(124,242,188,.16); border-color: rgba(124,242,188,.5); }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.mh .t { font-size: 20px; font-weight: 800; }
.mh .time { font-size: 13px; color: #C9F2DE; font-weight: 600; }
.bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 9px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.38); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; }
.lbl .big { font-weight: 800; }
.foot { position: absolute; bottom: 30px; left: 56px; right: 56px; display: flex; align-items: center; justify-content: space-between; }
.cta { background: #fff; color: #067647; font-size: 19px; font-weight: 800; padding: 12px 26px; border-radius: 99px; }
.foot .small { font-size: 15px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="brand"><div class="badge">⚽</div><div class="bname">GP Simulador del Mundial</div><div class="tag">● HOY · 16AVOS</div></div>
  <h1>Lo que dice el modelo hoy 📊</h1>
  <div class="grid">
    <div class="m star">
      <div class="mh"><div class="t">🇫🇷 Francia vs Suecia 🇸🇪</div><div class="time">4:00 PM COL</div></div>
      <div class="bar"><div class="h" style="width:69.7%"></div><div class="d" style="width:17.6%"></div><div class="a" style="width:12.6%"></div></div>
      <div class="lbl"><span class="big">🇫🇷 69.7%</span><span>X 17.6%</span><span>SUE 12.6%</span></div>
    </div>
    <div class="m">
      <div class="mh"><div class="t">🇲🇽 México vs Ecuador 🇪🇨</div><div class="time">8:00 PM COL</div></div>
      <div class="bar"><div class="h" style="width:41.8%"></div><div class="d" style="width:30.3%"></div><div class="a" style="width:27.9%"></div></div>
      <div class="lbl"><span class="big">🇲🇽 41.8%</span><span>X 30.3%</span><span>ECU 27.9%</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="small">Francia, favorito claro. México–Ecuador, el más parejo de la noche.</div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
