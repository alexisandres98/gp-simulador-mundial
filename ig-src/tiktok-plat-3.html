<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts/fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:"Inter",sans-serif;color:#EAF1F2;overflow:hidden;position:relative;
  background:radial-gradient(120% 60% at 50% 4%,#0C231B 0%,#081311 46%,#05080A 100%)}
.glow{position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:1000px;height:1000px;background:radial-gradient(circle,rgba(31,227,164,.16),transparent 62%)}
.top{position:absolute;top:120px;left:80px;right:80px;z-index:3}
.step{display:inline-flex;align-items:center;gap:16px;margin-bottom:26px}
.num{width:66px;height:66px;border-radius:50%;background:#1FE3A4;color:#06231A;font-family:"Space Grotesk",sans-serif;font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center}
.step .lbl{text-transform:uppercase;letter-spacing:5px;font-size:26px;font-weight:800;color:#1FE3A4}
h1{font-family:"Space Grotesk",sans-serif;font-size:82px;font-weight:800;letter-spacing:-3px;line-height:1.02;color:#fff}
.sub{font-size:34px;color:#9DB0B5;font-weight:600;margin-top:16px;max-width:820px}
.rows{position:absolute;top:640px;left:80px;right:80px;z-index:3;display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(160deg,#111A1E,#0D1417);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:34px 42px}
.row .bk{font-size:38px;font-weight:700;color:#9DB0B5}
.row .od{font-family:"Space Grotesk",sans-serif;font-size:52px;font-weight:800;color:#5F747B}
.row.best{border-color:rgba(31,227,164,.55);background:linear-gradient(160deg,rgba(31,227,164,.14),rgba(31,227,164,.03));box-shadow:0 0 60px -10px rgba(31,227,164,.4)}
.row.best .bk{color:#fff;display:flex;align-items:center;gap:16px}
.row.best .tick{width:52px;height:52px;border-radius:50%;background:#1FE3A4;color:#06231A;font-size:32px;display:flex;align-items:center;justify-content:center;font-weight:900}
.row.best .od{color:#1FE3A4}
.big40{position:absolute;bottom:230px;left:0;right:0;text-align:center;z-index:3}
.big40 b{font-family:"Space Grotesk",sans-serif;font-size:64px;font-weight:800;color:#fff}
.big40 span{font-size:34px;color:#9DB0B5;font-weight:600}
.foot{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:30px;color:#9DB0B5;font-weight:600;z-index:3}
</style></head><body>
<div class="glow"></div>
<div class="top">
  <div class="step"><div class="num">2</div><div class="lbl">The best price</div></div>
  <h1>Same pick.<br>More money back.</h1>
  <div class="sub">We compare the books for you and point to who pays the most.</div>
</div>
<div class="rows">
  <div class="row"><span class="bk">Book A</span><span class="od">1.28</span></div>
  <div class="row"><span class="bk">Book B</span><span class="od">1.31</span></div>
  <div class="row best"><span class="bk"><span class="tick">✓</span>We find you</span><span class="od">1.35</span></div>
</div>
<div class="big40"><b>40+</b> <span>sportsbooks scanned — automatically</span></div>
<div class="foot">Every extra point is money in your pocket.</div>
</body></html>
