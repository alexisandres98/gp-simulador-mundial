<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(150deg, #07271B 0%, #0A5C3C 62%, #0BA661 132%); color: #fff;
  padding: 44px 56px; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.brand { font-size: 25px; font-weight: 800; }
.tag { background: rgba(229,72,77,.95); font-weight: 800; font-size: 18px; padding: 8px 18px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; margin: 6px 0 2px; }
.sub { font-size: 21px; color: #C9F2DE; font-weight: 600; margin-bottom: 22px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.p { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; }
.p .l { min-width: 0; }
.p .fam { font-size: 15px; color: #7CF2BC; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
.p .sel { font-size: 27px; font-weight: 800; }
.p .odd { font-size: 40px; font-weight: 800; color: #7CF2BC; margin-left: 16px; white-space: nowrap; }
.foot { position: absolute; bottom: 34px; left: 56px; right: 56px; display: flex; align-items: center; justify-content: space-between; }
.foot .n { font-size: 19px; color: #C9F2DE; font-weight: 600; }
.foot .cta { font-size: 23px; font-weight: 800; }
</style></head>
<body>
  <div class="top"><div class="brand">⚽ GP Simulador</div><div class="tag">● PICKS DEL DÍA</div></div>
  <h1>🇫🇷 Francia vs Marruecos 🇲🇦</h1>
  <div class="sub">Cuarto de final · hoy 3:00 PM COL · 4 picks del modelo</div>
  <div class="grid">
    <div class="p"><div class="l"><div class="fam">Ganador</div><div class="sel">🇫🇷 Gana Francia</div></div><div class="odd">1.61</div></div>
    <div class="p"><div class="l"><div class="fam">Goleador</div><div class="sel">Mbappé anota</div></div><div class="odd">1.95</div></div>
    <div class="p"><div class="l"><div class="fam">Tarjetas</div><div class="sel">Menos de 2.5</div></div><div class="odd">2.52</div></div>
    <div class="p"><div class="l"><div class="fam">Córners</div><div class="sel">Menos de 11.5</div></div><div class="odd">1.35</div></div>
  </div>
  <div class="foot"><div class="n">Cuotas: la mejor entre 40+ casas</div><div class="cta">Análisis completo → gpsimulador.com</div></div>
</body></html>
