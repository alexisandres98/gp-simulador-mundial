<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #07271B 0%, #0A5C3C 55%, #0BA661 120%); color: #fff;
  display: flex; flex-direction: column; padding: 56px 54px; position: relative; }
.brand { display: flex; align-items: center; gap: 12px; }
.badge { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid rgba(255,255,255,.25); }
.bname { font-size: 21px; font-weight: 800; }
.tag { margin-left: auto; background: rgba(229,72,77,.95); font-weight: 800; font-size: 15px; padding: 9px 18px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 42px; font-weight: 800; letter-spacing: -1.2px; margin: 26px 0 26px; }
.m { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 20px; padding: 30px 32px; margin-bottom: 22px; }
.m.star { background: rgba(124,242,188,.16); border-color: rgba(124,242,188,.5); }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.mh .t { font-size: 28px; font-weight: 800; }
.mh .time { font-size: 17px; color: #C9F2DE; font-weight: 600; }
.bar { display: flex; height: 20px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 13px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.38); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 22px; font-weight: 700; }
.lbl .big { font-weight: 800; }
.foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 18px; }
.cta { background: #fff; color: #067647; font-size: 22px; font-weight: 800; padding: 16px 30px; border-radius: 99px; }
.foot .small { font-size: 17px; color: #C9F2DE; font-weight: 600; max-width: 540px; }
</style></head>
<body>
  <div class="brand"><div class="badge">⚽</div><div class="bname">GP Simulador del Mundial</div><div class="tag">● 16AVOS DE FINAL</div></div>
  <h1>Lo que dice el modelo hoy 📊</h1>
  <div class="m star">
    <div class="mh"><div class="t">🇫🇷 Francia vs Suecia 🇸🇪</div><div class="time">Hoy · 4:00 PM COL</div></div>
    <div class="bar"><div class="h" style="width:69.7%"></div><div class="d" style="width:17.6%"></div><div class="a" style="width:12.6%"></div></div>
    <div class="lbl"><span class="big">🇫🇷 69.7%</span><span>X 17.6%</span><span>Suecia 12.6%</span></div>
  </div>
  <div class="m">
    <div class="mh"><div class="t">🇲🇽 México vs Ecuador 🇪🇨</div><div class="time">Hoy · 8:00 PM COL</div></div>
    <div class="bar"><div class="h" style="width:41.8%"></div><div class="d" style="width:30.3%"></div><div class="a" style="width:27.9%"></div></div>
    <div class="lbl"><span class="big">🇲🇽 41.8%</span><span>X 30.3%</span><span>Ecuador 27.9%</span></div>
  </div>
  <div class="foot">
    <div class="small">Francia, favorito claro. México–Ecuador, el más parejo de la noche.</div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
