        ['Does this guarantee profits?', 'No. We publish verified analysis and plays with full transparency: the track record is public, hits and misses. Not financial advice.']
      ]
    }
  };
  var lang = 'es';
  try { var p = localStorage.getItem('gp_lang'); lang = (p === 'en' || p === 'es') ? p : ((navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es'); } catch (e) {}
  function T(k) { return D[lang][k]; }
  function feats(list) { return '<ul class="feats">' + list.map(function (f) { return '<li class="' + f[0] + '"><i>' + (f[0].indexOf('on') === 0 ? '✓' : '—') + '</i><span>' + f[1] + '</span></li>'; }).join('') + '</ul>'; }
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-k]').forEach(function (el) { var v = T(el.getAttribute('data-k')); if (v != null) el.innerHTML = v; });
    document.getElementById('sports').innerHTML = T('sports').map(function (sp) {
      return '<li class="' + (sp[2] ? 'live' : '') + '"><em>' + sp[0] + '</em>' + sp[1] +
        '<s>' + T(sp[2] ? 'sports_live' : 'sports_soon') + '</s></li>';
    }).join('');
    // checkout REAL de Whop (los plan IDs los inyecta el server desde env; sin IDs → botón "Muy pronto")
    var W = window.__WHOP || {};
    var co = function (key) { return '/api/founder/checkout?plan=' + key; };
    var note = function (mId) { return '<div class="pcta-note">' + (mId ? T('cta_note_live') : T('cta_note')) + '</div>'; };
    var annual = function (yId, key, txt) { var inner = '<span class="save">' + T('annual_save') + '</span> ' + txt; return '<div class="annual">' + (yId ? '<a href="' + co(key) + '">' + inner + '</a>' : '<span class="na">' + inner + '</span>') + '</div>'; };
    // Botón por plan según el plan ACTUAL del usuario (W.plan, inyectado por el server): "Tu plan actual" en el
    // que tiene, "Incluido" en los inferiores, checkout/upgrade en los superiores. Sin sesión → checkout normal.
    var RANK = { free: 0, pro: 1, sharp: 2 };
    var cur = W.plan;
    // Cripto (26-jul): pago ÚNICO de 30 días vía Coinbase Commerce en Whop (cripto no soporta renovación
    // automática) — para el público sin tarjeta. Al vencer, el plan cae solo a Free y la persona re-compra.
    var cryptoLink = function (cId, cKey) { return cId ? '<a class="pcta-crypto" href="' + co(cKey) + '">' + T('cta_crypto') + '</a><div class="pcta-note">' + T('cta_crypto_note') + '</div>' : ''; };
    var planBtn = function (planKey, mId, coKey, cId, cKey) {
      if (planKey === 'free') return '<button class="pcta" disabled>' + T((cur === 'pro' || cur === 'sharp') ? 'cta_included' : 'cta_current') + '</button><div class="pcta-note">&nbsp;</div>';
      if (cur === planKey) return '<button class="pcta" disabled>' + T('cta_current') + '</button><div class="pcta-note">&nbsp;</div>';
      if (cur && RANK[planKey] < RANK[cur]) return '<button class="pcta" disabled>' + T('cta_included') + '</button><div class="pcta-note">&nbsp;</div>';
      var label = (cur === 'pro' && planKey === 'sharp') ? T('cta_upgrade') : T('cta_buy');
      // FREE TRIAL (27-jul): en la card Sharp, si hay plan de trial y el usuario es elegible, el CTA
      // PRIMARIO es la prueba gratis; la suscripción directa queda como enlace secundario.
      if (planKey === 'sharp' && W.sharp_t && W.trial_eligible !== false) {
        return '<a class="pcta live" href="' + co('sharp_t') + '">' + T('trial_cta') + '</a>' +
          '<div class="pcta-note">' + T('trial_note') + '</div>' +
          (mId ? '<a class="pcta-crypto" href="' + co(coKey) + '">' + label + ' · ' + T('trial_or') + '</a>' : '') +
          cryptoLink(cId, cKey);
      }
      return (mId ? '<a class="pcta live" href="' + co(coKey) + '">' + label + '</a>' : '<button class="pcta" disabled>' + T('cta') + '</button>') + note(mId) + cryptoLink(cId, cKey);
    };
    document.getElementById('plans').innerHTML =
      '<div class="plan' + (cur === 'free' ? ' cur' : '') + '"><div class="pname">' + T('free_name') + '</div>' +
        '<div class="price"><span class="n">$0</span></div><div class="annual">&nbsp;</div>' +
        feats(T('f_free')) +
        planBtn('free') + '</div>' +
      '<div class="plan hl' + (cur === 'pro' ? ' cur' : '') + '" data-badge="' + T('badge') + '"><div class="pname">' + T('pro_name') + '</div>' +
        '<div class="price"><span class="n">$19</span><span class="per">' + T('mo') + '</span></div>' +
        annual(W.pro_y, 'pro_y', T('annual_pro')) +
        feats(T('f_pro')) +
        planBtn('pro', W.pro_m, 'pro_m', W.pro_c, 'pro_c') + '</div>' +
      '<div class="plan' + (cur === 'sharp' ? ' cur' : '') + '"><div class="pname">' + T('sharp_name') + '</div>' +
        '<div class="price"><span class="n">$59</span><span class="per">' + T('mo') + '</span></div>' +
        annual(W.sharp_y, 'sharp_y', T('annual_sharp')) +
        feats(T('f_sharp')) +
        planBtn('sharp', W.sharp_m, 'sharp_m', W.sharp_c, 'sharp_c') + '</div>';
    document.getElementById('faqs').innerHTML = T('faqs').map(function (q) { return '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('');
    document.querySelectorAll('#lang button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-l') === lang);
      b.onclick = function () { var l = b.getAttribute('data-l'); if (l === lang) return; try { localStorage.setItem('gp_lang', l); } catch (e) {} lang = l; render(); };
    });
  }
  render();
})();
</script>
</body>
</html>
