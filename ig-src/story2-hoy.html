<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(170deg, #07271B 0%, #0A5C3C 55%, #0BA661 100%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 90px; position: relative; }
.brand { position: absolute; top: 110px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; }
.tag { align-self: center; background: rgba(229,72,77,.95); font-weight: 800; font-size: 30px;
  padding: 16px 36px; border-radius: 99px; margin-bottom: 50px; letter-spacing: 2px; }
h1 { text-align: center; font-size: 72px; font-weight: 800; letter-spacing: -2px; margin-bottom: 70px; }
.m { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 26px;
  padding: 38px 42px; margin-bottom: 30px; }
.row { display: flex; align-items: center; justify-content: space-between; font-size: 40px; font-weight: 800; }
.row .p { color: #7CF2BC; font-size: 46px; }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; margin-top: 22px; background: rgba(255,255,255,.15); }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.35); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 25px; color: #C9F2DE; margin-top: 14px; font-weight: 600; }
.cta { position: absolute; bottom: 130px; left: 90px; right: 90px; background: #fff; color: #067647;
  font-size: 38px; font-weight: 800; padding: 32px; border-radius: 99px; text-align: center; }
.hint { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center; font-size: 26px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador del Mundial</div>
  <div class="tag">● HOY JUEGAN</div>
  <h1>¿A quién le va el modelo? 📊</h1>
  <div class="m">
    <div class="row"><span>🇨🇦 Canadá vs Bosnia 🇧🇦</span><span class="p">77%</span></div>
    <div class="bar"><div class="h" style="width:77%"></div><div class="d" style="width:17%"></div><div class="a" style="width:6%"></div></div>
    <div class="lbl"><span>Canadá 77%</span><span>empate 17%</span><span>Bosnia 7%</span></div>
  </div>
  <div class="m">
    <div class="row"><span>🇺🇸 EE.UU. vs Paraguay 🇵🇾</span><span class="p">⚖️</span></div>
    <div class="bar"><div class="h" style="width:33%"></div><div class="d" style="width:26%"></div><div class="a" style="width:41%"></div></div>
    <div class="lbl"><span>EE.UU. 33%</span><span>empate 26%</span><span>Paraguay 41%</span></div>
  </div>
  <div class="cta">Míralas moverse EN VIVO →</div>
  <div class="hint">⬆ link en bio · gpsimulador.com</div>
</body></html>
