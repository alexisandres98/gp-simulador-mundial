<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #07271B 0%, #0A5C3C 50%, #0BA661 100%); color: #fff;
  padding: 52px 60px; position: relative; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.badge { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid rgba(255,255,255,.25); }
.bname { font-size: 22px; font-weight: 800; }
.tag { margin-left: auto; background: rgba(229,72,77,.95); font-weight: 800; font-size: 15px; padding: 9px 18px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 38px; font-weight: 800; letter-spacing: -1px; margin-bottom: 26px; }
.m { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 18px; padding: 22px 28px; margin-bottom: 16px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mh .teams { font-size: 26px; font-weight: 800; }
.mh .time { font-size: 16px; color: #C9F2DE; font-weight: 600; }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 10px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.4); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; }
.lbl .big { font-size: 21px; font-weight: 800; }
.foot { position: absolute; bottom: 38px; left: 60px; right: 60px; display: flex; align-items: center; justify-content: space-between; }
.cta { background: #fff; color: #067647; font-size: 20px; font-weight: 800; padding: 14px 28px; border-radius: 99px; }
.foot .small { font-size: 16px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="brand"><div class="badge">⚽</div><div class="bname">GP Simulador del Mundial</div><div class="tag">● HOY JUEGAN</div></div>
  <h1>Lo que dice el modelo para hoy 📊</h1>
  <div class="m">
    <div class="mh"><div class="teams">🇶🇦 Catar vs Suiza 🇨🇭</div><div class="time">3 PM ET</div></div>
    <div class="bar"><div class="h" style="width:1.9%"></div><div class="d" style="width:10.9%"></div><div class="a" style="width:87.1%"></div></div>
    <div class="lbl"><span>Catar 1.9%</span><span>empate 10.9%</span><span class="big">🇨🇭 Suiza 87.1%</span></div>
  </div>
  <div class="m">
    <div class="mh"><div class="teams">🇧🇷 Brasil vs Marruecos 🇲🇦</div><div class="time">6 PM ET</div></div>
    <div class="bar"><div class="h" style="width:64.5%"></div><div class="d" style="width:21.1%"></div><div class="a" style="width:14.4%"></div></div>
    <div class="lbl"><span class="big">🇧🇷 Brasil 64.5%</span><span>empate 21.1%</span><span>Marruecos 14.4%</span></div>
  </div>
  <div class="foot">
    <div class="small">Míralas moverse EN VIVO con cada gol</div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
