<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(170deg, #07271B 0%, #0A5C3C 55%, #0BA661 100%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 90px; position: relative; }
.brand { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; }
.tag { align-self: center; background: rgba(229,72,77,.95); font-weight: 800; font-size: 28px;
  padding: 15px 34px; border-radius: 99px; margin-bottom: 56px; letter-spacing: 2px; }
h1 { text-align: center; font-size: 68px; font-weight: 800; letter-spacing: -2px; margin-bottom: 64px; }
.m { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 24px;
  padding: 36px 40px; margin-bottom: 32px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.mh .teams { font-size: 36px; font-weight: 800; }
.mh .time { font-size: 21px; color: #C9F2DE; font-weight: 600; }
.bar { display: flex; height: 26px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 18px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.4); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 25px; font-weight: 700; }
.lbl .big { font-size: 30px; font-weight: 800; }
.cta { position: absolute; bottom: 130px; left: 90px; right: 90px; background: #fff; color: #067647;
  font-size: 36px; font-weight: 800; padding: 30px; border-radius: 99px; text-align: center; }
.hint { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; font-size: 25px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador del Mundial</div>
  <div class="tag">● HOY JUEGAN</div>
  <h1>¿Qué dice el modelo? 📊</h1>
  <div class="m">
    <div class="mh"><div class="teams">🇶🇦 Catar vs Suiza 🇨🇭</div><div class="time">3 PM ET</div></div>
    <div class="bar"><div class="h" style="width:1.9%"></div><div class="d" style="width:10.9%"></div><div class="a" style="width:87.1%"></div></div>
    <div class="lbl"><span>Catar 1.9%</span><span>X 10.9%</span><span class="big">🇨🇭 87.1%</span></div>
  </div>
  <div class="m">
    <div class="mh"><div class="teams">🇧🇷 Brasil vs Marruecos 🇲🇦</div><div class="time">6 PM ET</div></div>
    <div class="bar"><div class="h" style="width:64.5%"></div><div class="d" style="width:21.1%"></div><div class="a" style="width:14.4%"></div></div>
    <div class="lbl"><span class="big">🇧🇷 64.5%</span><span>X 21.1%</span><span>Marruecos 14.4%</span></div>
  </div>
  <div class="cta">Míralas EN VIVO → gpsimulador.com</div>
  <div class="hint">⬆ link en bio</div>
</body></html>
