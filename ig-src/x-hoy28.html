<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(150deg, #07271B 0%, #0A5C3C 60%, #0BA661 130%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 56px 66px; position: relative; }
.brand { position: absolute; top: 34px; left: 66px; font-size: 25px; font-weight: 800; }
.tag { position: absolute; top: 34px; right: 66px; background: rgba(229,72,77,.95); font-weight: 800; font-size: 19px;
  padding: 8px 18px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 52px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 6px; margin-top: 30px; }
.sub { font-size: 23px; color: #C9F2DE; font-weight: 600; margin-bottom: 34px; }
.bar { display: flex; height: 34px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 16px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.38); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 30px; font-weight: 700; margin-bottom: 26px; }
.lbl .big { font-weight: 800; }
.foot { display: flex; align-items: center; justify-content: space-between; }
.gl { display: flex; gap: 34px; }
.gl .g .n { font-size: 27px; font-weight: 800; } .gl .g .k { font-size: 17px; color: #C9F2DE; font-weight: 600; }
.cta { font-size: 24px; font-weight: 800; color: #fff; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador</div>
  <div class="tag">● CUARTOS DE FINAL</div>
  <h1>🇫🇷 Francia vs Marruecos 🇲🇦</h1>
  <div class="sub">Gillette Stadium · Hoy 3:00 PM COL · probabilidad del modelo (90 min)</div>
  <div class="bar"><div class="h" style="width:55.0%"></div><div class="d" style="width:29.0%"></div><div class="a" style="width:16.0%"></div></div>
  <div class="lbl"><span class="big">🇫🇷 Francia 55%</span><span>Empate 29%</span><span>🇲🇦 Marruecos 16%</span></div>
  <div class="foot">
    <div class="gl">
      <div class="g"><div class="n">2.0 – 0.7</div><div class="k">goles esperados</div></div>
      <div class="g"><div class="n">2-0</div><div class="k">marcador probable</div></div>
      <div class="g"><div class="n">43%</div><div class="k">ambos anotan</div></div>
    </div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
