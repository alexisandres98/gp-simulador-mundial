<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts/fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:"Inter",sans-serif;color:#EAF1F2;overflow:hidden;position:relative;
  background:radial-gradient(130% 72% at 50% 100%,#0C231B 0%,#081311 48%,#05080A 100%)}
.glow{position:absolute;bottom:-200px;left:50%;transform:translateX(-50%);width:1100px;height:1100px;background:radial-gradient(circle,rgba(31,227,164,.24),transparent 62%)}
.brand{position:absolute;top:120px;left:0;right:0;text-align:center;font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:800;color:#fff;z-index:3}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;z-index:3;text-align:center}
.fig{width:300px;height:auto;filter:drop-shadow(0 0 60px rgba(31,227,164,.4));margin-bottom:50px}
.kick{text-transform:uppercase;letter-spacing:6px;font-size:26px;font-weight:800;color:#1FE3A4;margin-bottom:26px}
h1{font-family:"Space Grotesk",sans-serif;font-size:112px;font-weight:800;letter-spacing:-4px;line-height:.98;color:#fff;margin-bottom:30px}
h1 .g{color:#1FE3A4}
.sub{font-size:38px;font-weight:600;color:#9DB0B5;line-height:1.4;max-width:740px;margin-bottom:56px}
.cta{background:#1FE3A4;color:#06231A;font-family:"Space Grotesk",sans-serif;font-size:52px;font-weight:800;padding:36px 76px;border-radius:99px;letter-spacing:-1px;box-shadow:0 24px 70px rgba(31,227,164,.35)}
.free{margin-top:34px;font-size:34px;color:#EAF1F2;font-weight:700}
.free span{color:#1FE3A4}
.foot{position:absolute;bottom:110px;left:0;right:0;text-align:center;font-size:24px;color:#5F747B;font-weight:600;z-index:3}
</style></head><body>
<div class="glow"></div>
<div class="brand">⚽ GP Simulator</div>
<div class="wrap">
  <svg class="fig" viewBox="0 0 220 300" fill="none"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5C46"/><stop offset="1" stop-color="#3E2A20"/></linearGradient></defs>
    <path d="M80 150 L34 46" stroke="url(#sk)" stroke-width="28" stroke-linecap="round"/><path d="M140 150 L186 46" stroke="url(#sk)" stroke-width="28" stroke-linecap="round"/>
    <circle cx="32" cy="42" r="17" fill="url(#sk)"/><circle cx="188" cy="42" r="17" fill="url(#sk)"/>
    <circle cx="110" cy="74" r="36" fill="url(#sk)"/>
    <path d="M72 152 Q110 116 148 152 L154 300 L66 300 Z" fill="url(#sk)"/></svg>
  <div class="kick">Stop guessing · start knowing</div>
  <h1>It's <span class="g">free.</span></h1>
  <div class="sub">The picks, the best prices and your smart stake — all in one place.</div>
  <div class="cta">gpsimulador.com</div>
  <div class="free"><span>No card.</span> Just your email. 30 seconds.</div>
</div>
<div class="foot">Statistical estimates · not financial advice · 18+</div>
</body></html>
