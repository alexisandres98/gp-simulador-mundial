<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clubes · GP Intelligence</title>
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/tabler/fonts/tabler-icons.woff2?v3.31.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="/premium.css">
<style>
/* Extras mínimos de la fase clubes — SOLO tokens gx (hereda tema/tipografía/grano de premium.css) */
.cl-fx { padding: 13px 16px; border-bottom: 1px solid var(--gx-line); }
.cl-fx:last-child { border-bottom: 0; }
.cl-fx-teams { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
.cl-fx-teams .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-fx-teams .t.r { text-align: right; }
.cl-fx-when { font-family: var(--gx-mono, ui-monospace); font-size: 10.5px; color: var(--gx-text3); font-weight: 600; white-space: nowrap; }
.cl-bar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--gx-bg2); margin-bottom: 7px; }
.cl-bar .h { background: linear-gradient(90deg, #12B98A, var(--gx-pos, #2BE3A6)); }
.cl-bar .d { background: rgba(255,255,255,.22); }
.cl-bar .a { background: var(--gx-blue, #5FA8FF); opacity: .9; }
.cl-pct { display: flex; justify-content: space-between; font-family: var(--gx-mono, ui-monospace); font-size: 11px; color: var(--gx-text3); font-variant-numeric: tabular-nums; }
.cl-pct b { color: var(--gx-text); font-weight: 700; }
.cl-new { font-size: 9px; font-weight: 800; letter-spacing: .05em; color: var(--gx-warn, #F2C14E); border: 1px solid rgba(242,193,78,.35); border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.cl-trow { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--gx-line); font-size: 12.5px; }
.cl-trow:last-child { border-bottom: 0; }
.cl-trow .pos { width: 20px; color: var(--gx-text4); font-family: var(--gx-mono, ui-monospace); font-size: 10.5px; }
.cl-trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.cl-trow .elo { font-family: var(--gx-mono, ui-monospace); font-weight: 700; font-variant-numeric: tabular-nums; }
.cl-note { padding: 12px 16px; font-size: 11px; color: var(--gx-text3); line-height: 1.55; }
.cl-empty { padding: 26px 16px; text-align: center; color: var(--gx-text3); font-size: 12.5px; line-height: 1.5; }
.gx-nav.cl-soon { opacity: .38; cursor: default; }
</style>
</head>
<body>
<div id="gx-root"></div>
<script>
(function () {
  var S = { data: null, sel: null };
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function fmtDay(u) { try { return new Date(u).toLocaleString('es-CO', { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  var LOGO = '<div class="gx-logo" aria-hidden="true"><svg viewBox="0 0 34 34" width="34" height="34"><defs><linearGradient id="gxg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#12B98A"/><stop offset="1" stop-color="#1FE3A4"/></linearGradient></defs><rect x="8.5" y="18" width="4" height="8.5" rx="2" fill="rgba(31,227,164,.34)"/><rect x="15" y="13.5" width="4" height="13" rx="2" fill="rgba(31,227,164,.62)"/><rect x="21.5" y="7.5" width="4" height="19" rx="2" fill="url(#gxg)"/></svg></div>';
  function ic(n) { return '<i class="ti ti-' + n + '" aria-hidden="true"></i>'; }
  function kpiCard(label, icon, main, sub) {
    return '<div class="gx-panel gx-kpi"><div class="gx-label">' + ic(icon) + esc(label) + '</div>' +
      '<div class="gx-kpi-main"><div><div class="gx-kpi-sel">' + main + '</div>' + (sub ? '<div class="gx-dim" style="font-size:11px;margin-top:3px">' + esc(sub) + '</div>' : '') + '</div></div></div>';
  }

  function shell() {
    var Ls = (S.data && S.data.leagues) || [];
    var nav = Ls.map(function (L) {
      return '<div class="gx-nav' + (S.sel === L.key ? ' on' : '') + '" data-lg="' + esc(L.key) + '">' + ic('shield-half') + '<span>' + esc(L.name.split(' · ')[0]) + '</span></div>';
    }).join('');
    $('#gx-root').innerHTML =
      '<div class="gx">' +
      '<aside class="gx-side">' +
      '<div class="gx-brand">' + LOGO + '<div><b>GP Intelligence</b><span>Fase clubes · interno</span></div></div>' +
      '<div class="gx-navgroup"><div class="gx-label">Ligas en temporada</div>' + nav + '</div>' +
      '<div class="gx-navgroup"><div class="gx-label">En construcción</div>' +
      '<div class="gx-nav cl-soon">' + ic('target-arrow') + '<span>Picks por liga</span></div>' +
      '<div class="gx-nav cl-soon">' + ic('trending-up') + '<span>Value multi-liga</span></div>' +
      '<div class="gx-nav cl-soon">' + ic('calendar') + '<span>Calendario global</span></div>' +
      '<div class="gx-nav cl-soon">' + ic('users') + '<span>Perfiles de jugador</span></div>' +
      '</div>' +
      '<div class="gx-side-foot"><div class="gx-avatar">A</div><div style="font-size:12px"><b style="font-weight:600">Admin</b><div class="gx-dim" style="font-size:10.5px">Build interno · pre-fusión</div></div></div>' +
      '</aside>' +
      '<div class="gx-body">' +
      '<header class="gx-top">' +
      '<div class="gx-top-brand">' + LOGO + '<b>GP Intelligence</b></div>' +
      '<div class="gx-spacer"></div>' +
      '<span class="gx-prodchip on">Clubes · build interno</span>' +
      '<div class="gx-dim" style="font-size:11.5px;display:flex;align-items:center;gap:6px;margin-left:12px">' + ic('refresh') + '<span id="cl-upd"></span></div>' +
      '</header>' +
      '<div class="gx-main">' +
      '<div class="gx-content">' +
      '<div class="gx-ohead"><h1>Clubes</h1><div class="gx-seg" id="cl-pills"></div><div class="gx-spacer"></div></div>' +
      '<div class="gx-kpis" id="cl-kpis"></div>' +
      '<div class="gx-panel gx-board"><div class="gx-ph"><span class="gx-label">' + ic('calendar') + 'Próximos partidos</span><span class="gx-ph-extra" id="cl-count"></span></div><div id="cl-fixtures"></div></div>' +
      '</div>' +
      '<aside class="gx-cockpit">' +
      '<div class="gx-panel"><div class="gx-ph"><span class="gx-label">' + ic('chart-bar') + 'Ratings del modelo</span><span class="gx-ph-extra" id="cl-tmeta"></span></div><div id="cl-table"></div></div>' +
      '<div class="gx-panel"><div class="cl-note">Ratings Elo por competición, ajustados del historial de la temporada con localía aprendida por liga. Probabilidades del mismo núcleo del Mundial. Las picks por liga llegan tras el backtest con gates, nunca antes.</div></div>' +
      '</aside>' +
      '</div>' +
      '</div>' +
      '</div>';
    document.querySelectorAll('[data-lg]').forEach(function (el) { el.onclick = function () { S.sel = el.getAttribute('data-lg'); shell(); paint(); }; });
  }

  function paint() {
    var Ls = (S.data && S.data.leagues) || [];
    var L = Ls.find(function (x) { return x.key === S.sel; }) || Ls[0];
    if (!L) { $('#cl-fixtures').innerHTML = '<div class="cl-empty">Sin ligas. Corré el fit de ratings.</div>'; return; }
    S.sel = L.key;
    $('#cl-pills').innerHTML = Ls.map(function (x) { return '<button data-pg="' + esc(x.key) + '" class="' + (x.key === L.key ? 'on' : '') + '">' + esc(x.name.split(' · ')[0]) + '</button>'; }).join('');
    document.querySelectorAll('[data-pg]').forEach(function (el) { el.onclick = function () { S.sel = el.getAttribute('data-pg'); shell(); paint(); }; });

    var totFit = Ls.reduce(function (s, x) { return s + (x.n_matches || 0); }, 0);
    var totUp = Ls.reduce(function (s, x) { return s + ((x.upcoming || []).length); }, 0);
    $('#cl-kpis').innerHTML =
      kpiCard('Ligas en temporada', 'shield-half', String(Ls.length), 'LATAM primero · las 5 grandes entran en agosto') +
      kpiCard('Partidos en el fit', 'database', String(totFit), 'historial backfilleado (TSA)') +
      kpiCard('Próximos programados', 'calendar', String(totUp), 'cartelera viva · refresco cada 6 h') +
      kpiCard('Localía de ' + L.name.split(' · ')[0], 'home', '+' + L.hfa + ' Elo', 'aprendida del historial de la liga');

    var fx = (L.upcoming || []).map(function (f) {
      var nh = f.home.known ? '' : '<span class="cl-new">NUEVO</span>', na = f.away.known ? '' : '<span class="cl-new">NUEVO</span>';
      return '<div class="cl-fx">' +
        '<div class="cl-fx-teams"><span class="t">' + esc(f.home.name) + nh + '</span><span class="cl-fx-when">' + esc(fmtDay(f.utc)) + '</span><span class="t r">' + esc(f.away.name) + na + '</span></div>' +
        '<div class="cl-bar"><div class="h" style="width:' + (f.home.prob * 100) + '%"></div><div class="d" style="width:' + (f.draw * 100) + '%"></div><div class="a" style="width:' + (f.away.prob * 100) + '%"></div></div>' +
        '<div class="cl-pct"><b>' + pct(f.home.prob) + '</b><span>X ' + pct(f.draw) + '</span><b>' + pct(f.away.prob) + '</b></div>' +
        '</div>';
    }).join('');
    $('#cl-fixtures').innerHTML = fx || '<div class="cl-empty">Sin partidos programados en el proveedor todavía.<br>La cartelera se refresca sola cada 6 horas.</div>';
    $('#cl-count').textContent = L.name + ' · ' + (L.upcoming || []).length + ' partidos';

    $('#cl-table').innerHTML = (L.table || []).slice(0, 12).map(function (t, i) {
      return '<div class="cl-trow"><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(t.name) + '</span><span class="elo">' + t.elo + '</span></div>';
    }).join('');
    $('#cl-tmeta').textContent = L.n_matches + ' partidos';
    var f = S.data && S.data.fitted_at ? new Date(S.data.fitted_at).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    $('#cl-upd').textContent = 'fit ' + f;
  }

  fetch('/api/clubs/state', { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { S.data = j; shell(); paint(); })
    .catch(function (e) {
      document.getElementById('gx-root').innerHTML = '<div style="padding:60px;text-align:center;color:#9DB0B5;font-family:sans-serif">No se pudo cargar (' + esc(e.message) + '). ¿Sesión de admin activa?</div>';
    });
})();
</script>
</body>
</html>
