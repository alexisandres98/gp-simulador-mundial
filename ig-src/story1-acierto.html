<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(170deg, #07271B 0%, #0A5C3C 55%, #0BA661 100%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 90px; position: relative; }
.brand { position: absolute; top: 110px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; }
.tag { align-self: center; background: #fff; color: #067647; font-weight: 800; font-size: 30px;
  padding: 16px 36px; border-radius: 99px; margin-bottom: 60px; letter-spacing: 1px; }
.big { text-align: center; font-size: 190px; font-weight: 800; letter-spacing: -6px; line-height: 1; }
.sub2 { text-align: center; font-size: 52px; font-weight: 800; color: #7CF2BC; margin: 10px 0 80px; }
.card { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 26px;
  padding: 36px 40px; margin-bottom: 26px; text-align: center; }
.card .m { font-size: 40px; font-weight: 800; }
.card .pred { font-size: 27px; color: #C9F2DE; margin-top: 10px; font-weight: 600; }
.card .check { font-size: 32px; font-weight: 800; color: #7CF2BC; margin-top: 12px; }
.cta { position: absolute; bottom: 130px; left: 90px; right: 90px; background: #fff; color: #067647;
  font-size: 38px; font-weight: 800; padding: 32px; border-radius: 99px; text-align: center; }
.hint { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center; font-size: 26px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador del Mundial</div>
  <div class="tag">JORNADA 1 · RESULTADOS DEL MODELO</div>
  <div class="big">2/2</div>
  <div class="sub2">aciertos ✓</div>
  <div class="card">
    <div class="m">🇲🇽 México 2-0 Sudáfrica</div>
    <div class="pred">Predicción: México 85.6% · marcador más probable 2-0</div>
    <div class="check">MARCADOR EXACTO ✓</div>
  </div>
  <div class="card">
    <div class="m">🇰🇷 Corea 2-1 Chequia</div>
    <div class="pred">Predicción: Corea favorita con 41.1%</div>
    <div class="check">GANADOR ✓</div>
  </div>
  <div class="cta">gpsimulador.com</div>
  <div class="hint">⬆ link en bio · gratis con tu email</div>
</body></html>
