<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1000px; height:1000px; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(70% 60% at 50% 28%, #1FE6A6 0%, #0BA169 46%, #066B45 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#03261A; position:relative; }
/* anillo sutil para que se vea bien recortado en círculo */
.ring { position:absolute; inset:60px; border:3px solid rgba(255,255,255,.16); border-radius:50%; }
.gp { font-size:430px; font-weight:900; letter-spacing:-22px; line-height:.8; color:#03261A; text-shadow:0 10px 40px rgba(0,0,0,.18); }
.tagline { margin-top:18px; font-size:46px; font-weight:800; letter-spacing:8px; color:#053b29; text-transform:uppercase; }
.ball { position:absolute; bottom:150px; font-size:70px; opacity:.9; }
</style></head>
<body>
  <div class="ring"></div>
  <div class="gp">GP</div>
  <div class="tagline">Simulador</div>
  <div class="ball">⚽</div>
</body></html>
