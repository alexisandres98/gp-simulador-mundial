<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GP Simulador del Mundial 2026 · Probabilidades en vivo</title>
<meta name="description" content="Probabilidades en tiempo real de los 48 equipos del Mundial 2026: 10,000 torneos simulados, marcadores en vivo y oportunidades frente a Polymarket y Kalshi.">
<meta property="og:title" content="GP Simulador del Mundial 2026">
<meta property="og:description" content="¿Quién va a ganar el Mundial? Probabilidades en vivo partido a partido, simuladas 10,000 veces. Gratis con tu email.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gpsimulador.com">
<meta property="og:image" content="https://gpsimulador.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GP Simulador del Mundial 2026">
<meta name="twitter:description" content="¿Quién va a ganar el Mundial? Probabilidades en vivo que se mueven con cada gol. Gratis.">
<meta name="twitter:image" content="https://gpsimulador.com/og.png">
<meta name="theme-color" content="#070B0E">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300E58F'/><text x='50' y='66' font-size='40' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%2304140D'>GP</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr">
  <div class="hd-brand" onclick="switchTab(USER?'arb':'teams')">
    <div class="brand-badge">GP</div>
    <div class="brand-text">
      <div class="brand-name">GP Simulador</div>
      <div class="brand-tag">Simulador del Mundial</div>
    </div>
  </div>
  <div class="hd-right" id="hdRight"></div>
</header>

<div class="tape" id="tickerWrap" style="display:none">
  <span class="tape-lbl"><span class="tdot"></span>LIVE MARKETS · POLYMARKET</span>
  <div class="tape-vp"><div class="tape-track" id="ticker"></div></div>
</div>

<nav id="topnav"></nav>

<div id="banner" class="banner" style="display:none"></div>

<main>
  <section id="tab-teams" class="tab active"></section>
  <section id="tab-following" class="tab"></section>
  <section id="tab-alerts" class="tab"></section>
  <section id="tab-groups" class="tab"></section>
  <section id="tab-matches" class="tab"></section>
  <section id="tab-bracket" class="tab"></section>
  <section id="tab-arb" class="tab"></section>
  <section id="tab-opex" class="tab"></section>
  <section id="tab-registry" class="tab"></section>
  <section id="tab-perf" class="tab"></section>
  <section id="tab-record" class="tab"></section>
  <section id="tab-evo" class="tab"><canvas id="evoChart" width="1100" height="420"></canvas><div id="evoLegend"></div></section>
  <section id="tab-admin" class="tab"></section>
  <section id="tab-referidos" class="tab"></section>
  <section id="tab-sim" class="tab"></section>
  <!-- Fase 4: páginas profundas (no aparecen en la nav; se abren desde tarjetas) -->
  <section id="tab-match" class="tab"></section>
  <section id="tab-team" class="tab"></section>
</main>

<footer>
  <b>GP Simulador</b> · Modelo Elo + 10,000 torneos Monte Carlo · Mercados en vivo ·
  Las probabilidades son estimaciones de un modelo estadístico, no consejo financiero.
</footer>

<!-- bottom nav (móvil, logged-in) -->
<nav id="bottomnav" style="display:none"></nav>

<!-- menú de avatar -->
<div id="avatarMenu" class="avmenu" style="display:none"></div>

<!-- sheet "Más" -->
<div id="sheet" class="sheet" style="display:none" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-card" id="sheetBody"></div>
</div>

<!-- modal login -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-card">
    <button class="modal-x" onclick="closeModal()" aria-label="Cerrar">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
