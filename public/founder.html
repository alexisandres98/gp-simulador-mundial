<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Pass · GP Simulador</title>
<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-var.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: 'InterVar'; src: url('/fonts/inter-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root { --bg:#06090B; --panel:#0D1417; --panel2:#111A1E; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#EAF1F2; --tx2:#9DB0B5; --tx3:#5F747B; --ac:#1FE3A4; --acs:rgba(31,227,164,.12); --acl:rgba(31,227,164,.45);
  --amber:#FFC15E; --disp:'Space Grotesk',sans-serif; --sans:'InterVar',-apple-system,sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:15px; -webkit-font-smoothing:antialiased; overflow-x:hidden; overflow-x:clip; }
body { background:
  radial-gradient(1100px 520px at 15% -6%, rgba(31,227,164,.06), transparent 60%),
  radial-gradient(800px 420px at 100% 0%, rgba(255,193,94,.04), transparent 55%), var(--bg); }
.wrap { max-width:1060px; margin:0 auto; padding:0 22px 90px; }
.nav { display:flex; align-items:center; gap:12px; padding:22px 0; }
.logo { display:flex; align-items:center; gap:10px; font-family:var(--disp); font-weight:700; font-size:17px; }
.logo i { width:34px; height:34px; border-radius:10px; background:var(--acs); border:1px solid var(--acl); display:grid; place-items:center; font-style:normal; color:var(--ac); font-size:16px; }
.preview-chip { margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); border:1px solid rgba(255,193,94,.3); background:rgba(255,193,94,.07); padding:6px 12px; border-radius:99px; white-space:nowrap; }
.lang { display:flex; border:1px solid var(--line2); border-radius:99px; overflow:hidden; }
.lang button { background:none; border:0; color:var(--tx3); font-family:inherit; font-weight:700; font-size:12px; padding:7px 13px; cursor:pointer; }
.lang button.on { background:var(--acs); color:var(--ac); }
.hero { text-align:center; padding:44px 0 14px; }
.eyebrow { display:block; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ac); margin-bottom:16px; }
.eyebrow i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ac); box-shadow:0 0 10px rgba(31,227,164,.7); margin-right:8px; vertical-align:2px; }
h1 { font-family:var(--disp); font-size:clamp(34px,5.4vw,54px); font-weight:700; letter-spacing:-.03em; line-height:1.06; text-wrap:balance; }
h1 b { color:var(--ac); }
.sub { color:var(--tx2); font-size:16.5px; max-width:560px; margin:16px auto 0; line-height:1.55; }
.counter { display:inline-flex; align-items:center; gap:10px; margin-top:22px; border:1px solid rgba(255,193,94,.28); background:rgba(255,193,94,.06); padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:600; color:var(--tx2); }
.counter b { font-family:var(--disp); color:var(--amber); font-size:16px; white-space:nowrap; }
.plans { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:44px; align-items:stretch; }
@media (max-width:860px){ .plans { grid-template-columns:1fr; max-width:430px; margin-left:auto; margin-right:auto; } }
.plan { display:flex; flex-direction:column; background:linear-gradient(165deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:18px; padding:26px 24px; position:relative; }
.plan.hl { border-color:var(--acl); box-shadow:0 0 0 1px var(--acl), 0 24px 60px -30px rgba(31,227,164,.25); }
.plan.hl::before { content:attr(data-badge); position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--ac); color:#06231A; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:5px 14px; border-radius:99px; white-space:nowrap; }
.pname { font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--tx2); }
.plan.hl .pname { color:var(--ac); }
.price { display:flex; align-items:baseline; gap:8px; margin-top:14px; }
.price .n { font-family:var(--disp); font-weight:700; font-size:40px; letter-spacing:-.02em; }
.price .per { color:var(--tx3); font-size:13px; }
.price .was { color:var(--tx3); font-size:16px; text-decoration:line-through; font-weight:600; }
.founder-note { margin-top:6px; font-size:12px; font-weight:700; color:var(--amber); }
.annual { margin-top:4px; font-size:12px; color:var(--tx3); }
.feats { list-style:none; margin-top:20px; display:flex; flex-direction:column; gap:11px; flex:1; }
.feats li { display:flex; gap:10px; font-size:13.5px; color:var(--tx2); line-height:1.45; }
.feats li.on { color:var(--tx); }
.feats li.soon b::after { content:''; }
.feats i { flex:none; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:10px; margin-top:1px; }
.feats li.on i { background:var(--acs); color:var(--ac); border:1px solid var(--acl); }
.feats li.off i { background:rgba(255,255,255,.05); color:var(--tx3); border:1px solid var(--line); }
.soon-tag { display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--amber); border:1px solid rgba(255,193,94,.3); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px; }
.pcta { margin-top:22px; width:100%; border:0; border-radius:12px; font-family:inherit; font-weight:800; font-size:14.5px; padding:14px; cursor:not-allowed; display:block; text-align:center; text-decoration:none; box-sizing:border-box; }
.plan .pcta { background:rgba(255,255,255,.06); color:var(--tx3); border:1px solid var(--line2); }
.plan.hl .pcta { background:var(--ac); color:#06231A; opacity:.55; }
.pcta.live { cursor:pointer; background:var(--ac); color:#06231A; opacity:1; border:0; transition:transform .12s, filter .12s; }
.pcta.live:hover { transform:translateY(-1px); filter:brightness(1.06); }
.plan:not(.hl) .pcta.live { background:rgba(31,227,164,.14); color:var(--ac); border:1px solid var(--acl); }
.annual a { color:var(--tx2); }
.pcta-note { text-align:center; margin-top:9px; font-size:11px; color:var(--tx3); }
.faq { margin-top:70px; }
.faq h2 { font-family:var(--disp); font-size:24px; font-weight:700; letter-spacing:-.02em; text-align:center; }
.qs { max-width:640px; margin:26px auto 0; display:flex; flex-direction:column; gap:10px; }
details { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 18px; }
summary { cursor:pointer; font-weight:700; font-size:14px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
summary::after { content:'+'; color:var(--tx3); font-size:18px; font-weight:400; }
details[open] summary::after { content:'–'; }
details p { margin-top:10px; color:var(--tx2); font-size:13.5px; line-height:1.6; }
.foot { margin-top:70px; text-align:center; color:var(--tx3); font-size:12px; line-height:1.7; }
.foot a { color:var(--tx3); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="logo"><i>▟</i> GP Simulador</div>
    <span class="preview-chip" data-k="chip"></span>
    <div class="lang" id="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div>
  </nav>

  <header class="hero">
    <div class="eyebrow"><i></i><span data-k="eye"></span></div>
    <h1 data-k="h1"></h1>
    <p class="sub" data-k="sub"></p>
    <div class="counter">🔥 <span data-k="counter_pre"></span> <b>100 / 100</b> <span data-k="counter_post"></span></div>
  </header>

  <section class="plans" id="plans"></section>

  <section class="faq">
    <h2 data-k="faq_t"></h2>
    <div class="qs" id="faqs"></div>
  </section>

  <footer class="foot">
    <div data-k="foot_disc"></div>
    <div style="margin-top:8px" data-k="foot_legal"></div>
  </footer>
</div>

<script>
(function () {
  var D = {
    es: {
      chip: 'Preview interno',
      eye: 'Founder Pass · solo los primeros 100',
      h1: 'La ventaja completa, a <b>precio de fundador</b> para siempre.',
      sub: 'Los primeros 100 miembros aseguran su precio de por vida antes de la apertura pública. Después, se acabó.',
      counter_pre: 'Quedan', counter_post: 'cupos founder',
      faq_t: 'Preguntas frecuentes',
      foot_disc: 'Sugerencias educativas basadas en análisis estadístico. No es consejo financiero. Apostá con responsabilidad. 18+.',
      foot_legal: 'Términos y condiciones · Política de reembolso · Privacidad — (páginas en preparación)',
      free_name: 'Free', pro_name: 'Pro', sharp_name: 'Sharp',
      badge: 'Más popular',
      mo: '/mes', forever: 'de por vida, primeros 100', annual_pro: 'o $190/año (2 meses gratis)', annual_sharp: 'o $590/año (2 meses gratis)',
      cta_free: 'Tu plan actual', cta: 'Muy pronto', cta_buy: 'Asegurar mi Founder Pass', cta_note: 'El checkout se habilita en el lanzamiento', cta_note_live: 'Pago seguro vía Whop · cancelás cuando quieras', annual_link: 'anual',
      soon: 'Próximamente',
      f_free: [
        ['on', '1 pick del día (con delay) — solo ganador'],
        ['on', 'Probabilidades de cada partido'],
        ['on', 'Marcadores en vivo y simulador'],
        ['off', 'Picks completas del día'],
        ['off', 'Proyección de goles'],
        ['off', 'Calculadora de stake'],
        ['off', 'Value y arbitraje']
      ],
      f_pro: [
        ['on', '<b>Todas las picks del día</b> — ganador y goles, sin delay'],
        ['on', 'Análisis completo de cada partido (cockpit)'],
        ['on', '<b>Proyección de goles</b> de cada partido'],
        ['on', 'Calculadora de stake con gestión de bankroll'],
        ['on', 'Alertas por email'],
        ['on', 'Todo lo del plan Free'],
        ['off', 'Picks de córners, tarjetas y props'],
        ['off', 'Value y arbitraje en tiempo real']
      ],
      f_sharp: [
        ['on soon', '<b>Picks de córners, tarjetas y props</b><span class="soon-tag">Próximamente</span>'],
        ['on', '<b>Value</b>: cuotas mal pagadas detectadas por el modelo'],
        ['on', '<b>Arbitraje y precio atrasado</b> — scanner en tiempo real'],
        ['on', 'Alertas prioritarias (Telegram privado)'],
        ['on', 'Acceso anticipado a cada mercado nuevo'],
        ['on', 'Todo lo del plan Pro']
      ],
      faqs: [
        ['¿Qué es el precio founder?', 'Los primeros 100 miembros pagan $12 (Pro) o $39 (Sharp) al mes de por vida — mientras mantengan la suscripción activa, ese precio nunca sube, aunque los planes públicos cuesten más.'],
        ['¿Puedo cancelar cuando quiera?', 'Sí. Cancelás en un clic desde tu perfil y no se te cobra el mes siguiente. Sin permanencia ni letra chica.'],
        ['¿Hay reembolso?', 'Sí: si no te convence, tenés 7 días desde el primer pago para pedir el reembolso completo, sin preguntas.'],
        ['¿Qué pasa después del Mundial?', 'La plataforma sigue: fútbol de clubes y selecciones todo el año, con los mismos productos y nuevos mercados (córners, tarjetas, props) llegando primero a Sharp.'],
        ['¿Esto garantiza ganancias?', 'No. Publicamos análisis y jugadas verificadas con transparencia total — el historial es público, con aciertos y errores. No es consejo financiero.']
      ]
    },
    en: {
      chip: 'Internal preview',
      eye: 'Founder Pass · first 100 only',
      h1: 'The full edge, at a <b>founder price</b> forever.',
      sub: 'The first 100 members lock their lifetime price before the public launch. Then it’s gone.',
      counter_pre: '', counter_post: 'founder spots left',
      faq_t: 'Frequently asked questions',
      foot_disc: 'Educational suggestions based on statistical analysis. Not financial advice. Bet responsibly. 18+.',
      foot_legal: 'Terms & conditions · Refund policy · Privacy — (pages in preparation)',
      free_name: 'Free', pro_name: 'Pro', sharp_name: 'Sharp',
      badge: 'Most popular',
      mo: '/mo', forever: 'for life, first 100', annual_pro: 'or $190/yr (2 months free)', annual_sharp: 'or $590/yr (2 months free)',
      cta_free: 'Your current plan', cta: 'Coming soon', cta_buy: 'Lock my Founder Pass', cta_note: 'Checkout opens at launch', cta_note_live: 'Secure payment via Whop · cancel anytime', annual_link: 'annual',
      soon: 'Coming soon',
      f_free: [
        ['on', '1 pick a day (delayed) — winner only'],
        ['on', 'Probabilities for every match'],
        ['on', 'Live scores and simulator'],
        ['off', 'Full daily picks'],
        ['off', 'Goal projection'],
        ['off', 'Stake calculator'],
        ['off', 'Value & arbitrage']
      ],
      f_pro: [
        ['on', '<b>All daily picks</b> — winner & goals, no delay'],
        ['on', 'Full match analysis (cockpit)'],
        ['on', '<b>Goal projection</b> for every match'],
        ['on', 'Stake calculator with bankroll management'],
        ['on', 'Email alerts'],
        ['on', 'Everything in Free'],
        ['off', 'Corners, cards & props picks'],
        ['off', 'Real-time value & arbitrage']
      ],
      f_sharp: [
        ['on soon', '<b>Corners, cards & props picks</b><span class="soon-tag">Coming soon</span>'],
        ['on', '<b>Value</b>: mispriced odds caught by the model'],
        ['on', '<b>Arbitrage & stale prices</b> — real-time scanner'],
        ['on', 'Priority alerts (private Telegram)'],
        ['on', 'Early access to every new market'],
        ['on', 'Everything in Pro']
      ],
      faqs: [
        ['What is the founder price?', 'The first 100 members pay $12 (Pro) or $39 (Sharp) per month for life — as long as your subscription stays active, that price never goes up, even when public plans cost more.'],
        ['Can I cancel anytime?', 'Yes. One click from your profile and you won’t be charged the next month. No lock-in, no fine print.'],
        ['Is there a refund?', 'Yes: if it’s not for you, you have 7 days from your first payment for a full refund, no questions asked.'],
        ['What happens after the World Cup?', 'The platform continues: club and international football all year, same products, with new markets (corners, cards, props) landing on Sharp first.'],
        ['Does this guarantee profits?', 'No. We publish verified analysis and plays with full transparency — the track record is public, hits and misses. Not financial advice.']
      ]
    }
  };
  var lang = 'es';
  try { var p = localStorage.getItem('gp_lang'); lang = (p === 'en' || p === 'es') ? p : ((navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es'); } catch (e) {}
  function T(k) { return D[lang][k]; }
  function feats(list) { return '<ul class="feats">' + list.map(function (f) { return '<li class="' + f[0] + '"><i>' + (f[0].indexOf('on') === 0 ? '✓' : '—') + '</i><span>' + f[1] + '</span></li>'; }).join('') + '</ul>'; }
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-k]').forEach(function (el) { var v = T(el.getAttribute('data-k')); if (v != null) el.innerHTML = v; });
    // checkout REAL de Whop (los plan IDs los inyecta el server desde env; sin IDs → botón "Muy pronto")
    var W = window.__WHOP || {};
    var co = function (id) { return 'https://whop.com/checkout/' + id; };
    var cta = function (mId) { return mId ? '<a class="pcta live" href="' + co(mId) + '" target="_blank" rel="noopener">' + T('cta_buy') + '</a>' : '<button class="pcta" disabled>' + T('cta') + '</button>'; };
    var note = function (mId) { return '<div class="pcta-note">' + (mId ? T('cta_note_live') : T('cta_note')) + '</div>'; };
    var annual = function (yId, txt) { return '<div class="annual">' + (yId ? '<a href="' + co(yId) + '" target="_blank" rel="noopener">' + txt + '</a>' : txt) + '</div>'; };
    document.getElementById('plans').innerHTML =
      '<div class="plan"><div class="pname">' + T('free_name') + '</div>' +
        '<div class="price"><span class="n">$0</span></div><div class="annual">&nbsp;</div>' +
        feats(T('f_free')) +
        '<button class="pcta" disabled>' + T('cta_free') + '</button><div class="pcta-note">&nbsp;</div></div>' +
      '<div class="plan hl" data-badge="' + T('badge') + '"><div class="pname">' + T('pro_name') + '</div>' +
        '<div class="price"><span class="n">$12</span><span class="per">' + T('mo') + '</span><span class="was">$19</span></div>' +
        '<div class="founder-note">★ ' + T('forever') + '</div>' + annual(W.pro_y, T('annual_pro')) +
        feats(T('f_pro')) +
        cta(W.pro_m) + note(W.pro_m) + '</div>' +
      '<div class="plan"><div class="pname">' + T('sharp_name') + '</div>' +
        '<div class="price"><span class="n">$39</span><span class="per">' + T('mo') + '</span><span class="was">$59</span></div>' +
        '<div class="founder-note">★ ' + T('forever') + '</div>' + annual(W.sharp_y, T('annual_sharp')) +
        feats(T('f_sharp')) +
        cta(W.sharp_m) + note(W.sharp_m) + '</div>';
    document.getElementById('faqs').innerHTML = T('faqs').map(function (q) { return '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('');
    document.querySelectorAll('#lang button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-l') === lang);
      b.onclick = function () { var l = b.getAttribute('data-l'); if (l === lang) return; try { localStorage.setItem('gp_lang', l); } catch (e) {} lang = l; render(); };
    });
  }
  render();
})();
</script>
</body>
</html>
