<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: radial-gradient(140% 80% at 50% 8%, #0C231B 0%, #081311 45%, #060A0C 100%); color: #EAF1F2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 78px; position: relative; overflow: hidden; }
.glow { position:absolute; top:-140px; left:50%; transform:translateX(-50%); width:900px; height:900px; background:radial-gradient(circle, rgba(31,227,164,.18), transparent 62%); }
.brand { position:absolute; top:118px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:14px; font-size:31px; font-weight:800; color:#fff; z-index:2; }
.badge { width:48px; height:48px; border-radius:14px; background:rgba(31,227,164,.16); display:flex; align-items:center; justify-content:center; font-size:27px; border:1px solid rgba(31,227,164,.42); }
.kicker { z-index:2; text-transform:uppercase; letter-spacing:5px; font-size:26px; font-weight:800; color:#1FE3A4; margin-bottom:34px; }
.hook { z-index:2; text-align:center; font-size:118px; font-weight:800; letter-spacing:-4px; line-height:.96; color:#fff; margin-bottom:44px; }
.hook .hl { color:#1FE3A4; }
.sub { z-index:2; text-align:center; font-size:37px; font-weight:600; color:#9DB0B5; line-height:1.42; margin-bottom:78px; max-width:820px; }
.rows { z-index:2; width:100%; display:flex; flex-direction:column; gap:22px; margin-bottom:80px; }
.row { display:flex; align-items:center; justify-content:center; gap:30px; background:linear-gradient(160deg, rgba(19,30,34,.9), rgba(13,20,23,.9)); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:30px 34px; }
.row .side { font-size:44px; font-weight:800; letter-spacing:-1px; flex:1; }
.row .l { text-align:right; } .row .r { text-align:left; }
.row .vs { font-size:26px; font-weight:800; color:#1FE3A4; background:rgba(31,227,164,.12); border:1px solid rgba(31,227,164,.3); width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.cta { z-index:2; background:#1FE3A4; color:#06231A; font-size:46px; font-weight:800; padding:34px 74px; border-radius:99px; letter-spacing:-.5px; box-shadow:0 20px 60px rgba(31,227,164,.28); }
.foot { z-index:2; position:absolute; bottom:104px; left:0; right:0; text-align:center; font-size:28px; color:#9DB0B5; font-weight:700; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="brand"><div class="badge">⚽</div>GP World Cup Simulator</div>
  <div class="kicker">Round of 16 · World Cup 2026</div>
  <div class="hook">Who wins<br><span class="hl">today?</span></div>
  <div class="sub">See our data projections for every match of the day — <b style="color:#EAF1F2">100% free</b>.</div>
  <div class="rows">
    <div class="row"><span class="side l">🇪🇸 Spain</span><span class="vs">?</span><span class="side r">Austria 🇦🇹</span></div>
    <div class="row"><span class="side l">🇵🇹 Portugal</span><span class="vs">?</span><span class="side r">Croatia 🇭🇷</span></div>
    <div class="row"><span class="side l">🇨🇭 Switzerland</span><span class="vs">?</span><span class="side r">Algeria 🇩🇿</span></div>
  </div>
  <div class="cta">gpsimulador.com</div>
  <div class="foot">Swipe to see today's projections ➡️</div>
</body></html>
