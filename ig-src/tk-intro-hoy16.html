<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: radial-gradient(120% 80% at 50% 18%, #0BA661 0%, #0A5C3C 45%, #07271B 100%); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 90px; }
.ball { font-size: 150px; margin-bottom: 10px; }
.brand { font-size: 38px; font-weight: 800; letter-spacing: 1px; color: #C9F2DE; margin-bottom: 60px; }
.kick { font-size: 44px; font-weight: 800; color: #7CF2BC; letter-spacing: 6px; margin-bottom: 18px; }
h1 { font-size: 118px; font-weight: 900; letter-spacing: -4px; line-height: .98; margin-bottom: 40px; }
.tag { background: rgba(229,72,77,.95); font-weight: 800; font-size: 40px; padding: 20px 46px; border-radius: 99px; letter-spacing: 3px; margin-bottom: 56px; }
.sub { font-size: 46px; font-weight: 700; color: #EAFBF3; line-height: 1.3; }
.sub b { color: #7CF2BC; }
</style></head>
<body>
  <div class="ball">⚽</div>
  <div class="brand">GP SIMULADOR DEL MUNDIAL</div>
  <div class="kick">MUNDIAL 2026</div>
  <h1>¿Qué dice<br>el modelo?</h1>
  <div class="tag">● HOY · 6 PARTIDOS</div>
  <div class="sub"><b>10.000 simulaciones</b><br>por partido 📊</div>
</body></html>
