<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: radial-gradient(circle at 30% 25%, #0BA661 0%, #0A5C3C 55%, #07271B 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.ring { position: absolute; width: 920px; height: 920px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); }
.ball { font-size: 200px; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 14px 30px rgba(0,0,0,.35)); }
.gp { font-size: 300px; font-weight: 800; color: #fff; letter-spacing: -12px; line-height: .95;
  text-shadow: 0 10px 36px rgba(0,0,0,.3); }
.sub { margin-top: 18px; font-size: 44px; font-weight: 800; color: #C9F2DE; letter-spacing: 6px; }
</style></head>
<body>
  <div class="ring"></div>
  <div class="ball">⚽</div>
  <div class="gp">GP</div>
  <div class="sub">SIMULADOR</div>
</body></html>
