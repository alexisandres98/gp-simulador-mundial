<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(170deg, #07271B 0%, #0A5C3C 60%, #0BA661 130%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 64px; position: relative; }
.brand { display: flex; align-items: center; justify-content: center; gap: 10px; position: absolute; top: 56px; left: 0; right: 0; text-align: center; font-size: 28px; font-weight: 800; }
.tag { align-self: center; background: rgba(229,72,77,.95); font-weight: 800; font-size: 21px;
  padding: 11px 24px; border-radius: 99px; margin-bottom: 26px; letter-spacing: 2px; }
h1 { text-align: center; font-size: 47px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 36px; }
.m { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 20px; padding: 30px 32px; margin-bottom: 22px; }
.m.star { background: rgba(124,242,188,.16); border-color: rgba(124,242,188,.5); }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.mh .t { font-size: 29px; font-weight: 800; }
.mh .time { font-size: 19px; color: #C9F2DE; font-weight: 600; }
.bar { display: flex; height: 21px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 13px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.38); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 23px; font-weight: 700; }
.lbl .big { font-weight: 800; }
.foot { position: absolute; bottom: 54px; left: 64px; right: 64px; display: flex; align-items: center; justify-content: space-between; }
.small { font-size: 20px; color: #C9F2DE; font-weight: 600; }
.cta { background: #fff; color: #067647; font-size: 23px; font-weight: 800; padding: 16px 30px; border-radius: 99px; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador del Mundial</div>
  <div class="tag">● OCTAVOS DE FINAL</div>
  <h1>Lo que dice el modelo hoy 📊</h1>
  <div class="m">
    <div class="mh"><div class="t">🇦🇷 Argentina vs Egipto 🇪🇬</div><div class="time">11:00 AM COL</div></div>
    <div class="bar"><div class="h" style="width:68.7%"></div><div class="d" style="width:20.1%"></div><div class="a" style="width:11.3%"></div></div>
    <div class="lbl"><span class="big">🇦🇷 68.7%</span><span>X 20.1%</span><span>Egipto 11.3%</span></div>
  </div>
  <div class="m star">
    <div class="mh"><div class="t">🇨🇭 Suiza vs Colombia 🇨🇴</div><div class="time">3:00 PM COL</div></div>
    <div class="bar"><div class="h" style="width:26.2%"></div><div class="d" style="width:28.7%"></div><div class="a" style="width:45.1%"></div></div>
    <div class="lbl"><span>🇨🇭 26.2%</span><span>X 28.7%</span><span class="big">Colombia 45.1%</span></div>
  </div>
  <div class="foot">
    <div class="small">Colombia favorita en Vancouver y Argentina aplanadora en Atlanta 👀</div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
