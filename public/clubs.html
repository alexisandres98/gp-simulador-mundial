<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clubes · GP Intelligence</title>
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/tabler/fonts/tabler-icons.woff2?v3.31.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="/premium.css">
<style>
/* Extras de la fase clubes — SOLO tokens gx (tema/grano/tipografía heredados de premium.css) */
.cl-fx { padding: 12px 16px; border-bottom: 1px solid var(--gx-line); cursor: pointer; transition: background .12s; }
.cl-fx:hover { background: var(--gx-bg2); }
.cl-fx.on { background: var(--gx-bg2); box-shadow: inset 3px 0 0 var(--gx-pos, #2BE3A6); }
.cl-fx:last-child { border-bottom: 0; }
.cl-fx-teams { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13.5px; font-weight: 700; margin-bottom: 7px; }
.cl-fx-teams .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-fx-teams .t.r { text-align: right; }
.cl-fx-when { font-family: var(--gx-mono, ui-monospace); font-size: 10.5px; color: var(--gx-text3); font-weight: 600; white-space: nowrap; }
.cl-lg { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gx-text3); }
.cl-bar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--gx-bg2); margin-bottom: 6px; }
.cl-bar .h { background: linear-gradient(90deg, #12B98A, var(--gx-pos, #2BE3A6)); }
.cl-bar .d { background: rgba(255,255,255,.22); }
.cl-bar .a { background: var(--gx-blue, #5FA8FF); opacity: .9; }
.cl-pct { display: flex; justify-content: space-between; font-family: var(--gx-mono, ui-monospace); font-size: 11px; color: var(--gx-text3); font-variant-numeric: tabular-nums; }
.cl-pct b { color: var(--gx-text); font-weight: 700; }
.cl-new { font-size: 9px; font-weight: 800; letter-spacing: .05em; color: var(--gx-warn, #F2C14E); border: 1px solid rgba(242,193,78,.35); border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.cl-gate { font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.cl-gate.ok { color: var(--gx-pos, #2BE3A6); border: 1px solid rgba(43,227,166,.4); background: rgba(43,227,166,.08); }
.cl-gate.sh { color: var(--gx-warn, #F2C14E); border: 1px solid rgba(242,193,78,.35); background: rgba(242,193,78,.07); }
.cl-trow { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--gx-line); font-size: 12.5px; }
.cl-trow:last-child { border-bottom: 0; }
.cl-trow.hl { background: rgba(43,227,166,.06); box-shadow: inset 3px 0 0 var(--gx-pos, #2BE3A6); }
.cl-trow .pos { width: 20px; color: var(--gx-text4); font-family: var(--gx-mono, ui-monospace); font-size: 10.5px; }
.cl-trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.cl-trow .num { font-family: var(--gx-mono, ui-monospace); font-variant-numeric: tabular-nums; color: var(--gx-text3); font-size: 11.5px; width: 52px; text-align: right; }
.cl-trow .num.b { color: var(--gx-text); font-weight: 700; }
.cl-note { padding: 12px 16px; font-size: 11px; color: var(--gx-text3); line-height: 1.55; }
.cl-empty { padding: 26px 16px; text-align: center; color: var(--gx-text3); font-size: 12.5px; line-height: 1.5; }
.cl-day { padding: 9px 16px 7px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gx-text3); border-bottom: 1px solid var(--gx-line); background: var(--gx-bg2); position: sticky; top: 0; }
.gx-nav.cl-soon { opacity: .38; cursor: default; }
/* cockpit de clubes */
.ck-h { padding: 14px 16px 10px; border-bottom: 1px solid var(--gx-line); }
.ck-teams { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--gx-disp, inherit); font-weight: 700; font-size: 14.5px; }
.ck-teams .e { font-family: var(--gx-mono, ui-monospace); font-size: 10px; color: var(--gx-text3); display: block; font-weight: 600; }
.ck-vs { color: var(--gx-text4); font-size: 10px; font-weight: 700; }
.ck-sec { padding: 12px 16px; border-bottom: 1px solid var(--gx-line); }
.ck-sec:last-child { border-bottom: 0; }
.ck-lbl { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gx-text3); margin-bottom: 8px; }
.ck-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
.ck-row .v { font-family: var(--gx-mono, ui-monospace); font-weight: 700; font-variant-numeric: tabular-nums; }
.ck-caveat { font-size: 10.5px; color: var(--gx-warn, #F2C14E); line-height: 1.45; }
/* value rows */
.cl-vrow { padding: 11px 16px; border-bottom: 1px solid var(--gx-line); cursor: pointer; }
.cl-vrow:hover { background: var(--gx-bg2); }
.cl-vrow-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }
.cl-vrow-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--gx-text3); font-family: var(--gx-mono, ui-monospace); }
.cl-edge { font-weight: 800; } .cl-edge.pos { color: var(--gx-pos, #2BE3A6); } .cl-edge.neg { color: #F09595; }
/* simulador */
.cl-simgrid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: end; padding: 16px; }
.cl-simgrid select { width: 100%; background: var(--gx-bg2); color: var(--gx-text); border: 1px solid var(--gx-line2, rgba(255,255,255,.16)); border-radius: 10px; padding: 9px 10px; font-family: inherit; font-size: 13px; margin-top: 6px; }
.cl-simbtn { background: var(--gx-pos, #2BE3A6); color: #06231A; font-weight: 800; font-size: 13.5px; border: 0; border-radius: 99px; padding: 11px 22px; cursor: pointer; font-family: inherit; }
@media (max-width: 900px) { .cl-simgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="gx-root"></div>
<script>
(function () {
  var S = { data: null, view: 'opps', lg: null, value: null, ck: null, hlTeam: null };
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function fmtDay(u) { try { return new Date(u).toLocaleString('es-CO', { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function dayKey(u) { try { var d = new Date(u), t = new Date(); var dd = Math.floor((d - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); if (dd === 0) return 'Hoy'; if (dd === 1) return 'Mañana'; return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  var LOGO = '<div class="gx-logo" aria-hidden="true"><svg viewBox="0 0 34 34" width="34" height="34"><defs><linearGradient id="gxg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#12B98A"/><stop offset="1" stop-color="#1FE3A4"/></linearGradient></defs><rect x="8.5" y="18" width="4" height="8.5" rx="2" fill="rgba(31,227,164,.34)"/><rect x="15" y="13.5" width="4" height="13" rx="2" fill="rgba(31,227,164,.62)"/><rect x="21.5" y="7.5" width="4" height="19" rx="2" fill="url(#gxg)"/></svg></div>';
  function ic(n) { return '<i class="ti ti-' + n + '" aria-hidden="true"></i>'; }
  function gateChip(g) { if (!g) return ''; return g.status === 'approved' ? '<span class="cl-gate ok">Gate aprobado</span>' : '<span class="cl-gate sh">En calibración</span>'; }
  function leagues() { return (S.data && S.data.leagues) || []; }
  function lg() { return leagues().find(function (x) { return x.key === S.lg; }) || leagues()[0]; }

  var NAVS = [
    ['opps', 'target-arrow', 'Oportunidades'],
    ['cal', 'calendar', 'Calendario global'],
    ['board', 'layout-grid', 'Cartelera por liga'],
    ['tables', 'table', 'Tablas'],
    ['sim', 'arrows-shuffle', 'Simulador'],
  ];

  function shell() {
    var nav = NAVS.map(function (n) { return '<div class="gx-nav' + (S.view === n[0] ? ' on' : '') + '" data-v="' + n[0] + '">' + ic(n[1]) + '<span>' + esc(n[2]) + '</span></div>'; }).join('');
    $('#gx-root').innerHTML =
      '<div class="gx">' +
      '<aside class="gx-side">' +
      '<div class="gx-brand">' + LOGO + '<div><b>GP Intelligence</b><span>Fase clubes · interno</span></div></div>' +
      '<div class="gx-navgroup">' + nav + '</div>' +
      '<div class="gx-navgroup"><div class="gx-label">En construcción</div>' +
      '<div class="gx-nav cl-soon">' + ic('sparkles') + '<span>Picks por liga · al gate</span></div>' +
      '<div class="gx-nav cl-soon">' + ic('users') + '<span>Perfiles de jugador</span></div>' +
      '<div class="gx-nav cl-soon">' + ic('shield') + '<span>Escudos y logos</span></div>' +
      '</div>' +
      '<div class="gx-side-foot"><div class="gx-avatar">A</div><div style="font-size:12px"><b style="font-weight:600">Admin</b><div class="gx-dim" style="font-size:10.5px">Build interno · pre-fusión</div></div></div>' +
      '</aside>' +
      '<div class="gx-body">' +
      '<header class="gx-top">' +
      '<div class="gx-top-brand">' + LOGO + '<b>GP Intelligence</b></div>' +
      '<div class="gx-search">' + ic('search') + '<input id="cl-search" autocomplete="off" spellcheck="false" placeholder="Buscar equipo en 14 ligas…"><div class="gx-search-res" id="cl-search-res" hidden></div></div>' +
      '<div class="gx-spacer"></div>' +
      '<span class="gx-prodchip on">Clubes · build interno</span>' +
      '</header>' +
      '<div class="gx-main">' +
      '<div class="gx-content" id="cl-main"></div>' +
      '<aside class="gx-cockpit" id="cl-ck"></aside>' +
      '</div>' +
      '</div>' +
      '</div>';
    document.querySelectorAll('[data-v]').forEach(function (el) { el.onclick = function () { S.view = el.getAttribute('data-v'); shell(); paint(); }; });
    wireSearch();
  }

  // ── COCKPIT (derecha, persistente): el análisis del cruce seleccionado con los engines reales ──
  function ckLoad(hl, h, al, a, neutral) {
    $('#cl-ck').innerHTML = '<div class="gx-panel"><div class="cl-empty">Cargando análisis…</div></div>';
    fetch('/api/clubs/match?hl=' + hl + '&h=' + h + '&al=' + (al || hl) + '&a=' + a + (neutral ? '&neutral=1' : ''), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (m) { S.ck = m; ckPaint(); })
      .catch(function () { $('#cl-ck').innerHTML = '<div class="gx-panel"><div class="cl-empty">No se pudo cargar el análisis.</div></div>'; });
  }
  function ckPaint() {
    var m = S.ck;
    if (!m || m.error) { $('#cl-ck').innerHTML = '<div class="gx-panel"><div class="cl-empty">Seleccioná un partido de la cartelera<br>para ver el análisis del modelo.</div></div>'; return; }
    var vRows = ((S.value && S.value.rows) || []).filter(function (v) { return v.home === m.home.name && v.away === m.away.name; }).slice(0, 3);
    var valueHtml = vRows.length
      ? '<div class="ck-sec"><div class="ck-lbl">Value vs mercado · shadow</div>' + vRows.map(function (v) {
        var oc = v.outcome === 'home' ? m.home.name : v.outcome === 'away' ? m.away.name : 'Empate';
        return '<div class="ck-row"><span>' + esc(oc) + ' <span class="gx-dim">@' + v.best_odds + '</span></span><span class="v cl-edge ' + (v.edge_pp > 0 ? 'pos' : 'neg') + '">' + (v.edge_pp > 0 ? '+' : '') + v.edge_pp + 'pp</span></div>';
      }).join('') + '</div>'
      : '';
    $('#cl-ck').innerHTML =
      '<div class="gx-panel">' +
      '<div class="ck-h"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="cl-lg">' + esc(m.cross_league ? m.home.league_name + ' vs ' + m.away.league_name : m.home.league_name) + '</span>' + gateChip({ status: m.gate }) + '</div>' +
      '<div class="ck-teams"><span>' + esc(m.home.name) + '<span class="e">Elo ' + m.home.elo + '</span></span><span class="ck-vs">VS</span><span style="text-align:right">' + esc(m.away.name) + '<span class="e">Elo ' + m.away.elo + '</span></span></div></div>' +
      '<div class="ck-sec"><div class="ck-lbl">Probabilidad del modelo · 90 min' + (m.neutral ? ' · cancha neutral' : '') + '</div>' +
      '<div class="cl-bar"><div class="h" style="width:' + (m.probs.home * 100) + '%"></div><div class="d" style="width:' + (m.probs.draw * 100) + '%"></div><div class="a" style="width:' + (m.probs.away * 100) + '%"></div></div>' +
      '<div class="cl-pct"><b>' + pct(m.probs.home) + '</b><span>X ' + pct(m.probs.draw) + '</span><b>' + pct(m.probs.away) + '</b></div></div>' +
      '<div class="ck-sec"><div class="ck-lbl">Proyección de goles</div>' +
      '<div class="ck-row"><span>xG esperado</span><span class="v">' + m.xg.home + ' – ' + m.xg.away + '</span></div>' +
      (m.over25 != null ? '<div class="ck-row"><span>Más de 2.5 goles</span><span class="v">' + pct(m.over25) + '</span></div>' : '') +
      (m.btts != null ? '<div class="ck-row"><span>Ambos anotan</span><span class="v">' + pct(m.btts) + '</span></div>' : '') +
      '</div>' +
      '<div class="ck-sec"><div class="ck-lbl">Marcadores más probables</div>' +
      (m.top_scores || []).map(function (s) { return '<div class="ck-row"><span>' + esc(s.score) + '</span><span class="v">' + pct(s.p) + '</span></div>'; }).join('') +
      '</div>' +
      valueHtml +
      (m.cross_league ? '<div class="ck-sec"><div class="ck-caveat">Cruce entre ligas: cada liga se calibra por separado, la comparación es aproximada (base 1500 común, sin ajuste inter-liga todavía).</div></div>' : '') +
      '</div>';
  }

  // ── VISTAS ──
  function vOpps() {
    var Ls = leagues();
    var gatesOk = Ls.filter(function (x) { return x.gate && x.gate.status === 'approved'; }).length;
    var withOdds = Ls.filter(function (x) { return x.odds_key && !x.starts; }).length;
    var rows = (S.value && S.value.rows) || [];
    var list = rows.slice(0, 20).map(function (v) {
      var oc = v.outcome === 'home' ? v.home : v.outcome === 'away' ? v.away : 'Empate';
      return '<div class="cl-vrow" data-vh="' + esc(v.home) + '" data-va="' + esc(v.away) + '" data-vl="' + esc(v.league) + '">' +
        '<div class="cl-vrow-top"><span>' + esc(v.home) + ' vs ' + esc(v.away) + '</span><span class="cl-edge ' + (v.edge_pp > 0 ? 'pos' : 'neg') + '">' + (v.edge_pp > 0 ? '+' : '') + v.edge_pp + 'pp</span></div>' +
        '<div class="cl-vrow-sub"><span>' + esc(v.league_name) + ' · ' + esc(oc) + ' @' + v.best_odds + ' (' + esc(v.best_book || '') + ')</span><span>' + v.books + ' casas · ' + esc(fmtDay(v.utc)) + '</span></div>' +
        '</div>';
    }).join('');
    $('#cl-main').innerHTML =
      '<div class="gx-ohead"><h1>Oportunidades</h1><div class="gx-spacer"></div><div class="gx-dim" style="font-size:11.5px">' + (S.value ? 'escaneo ' + new Date(S.value.refreshed_at).toLocaleTimeString('es-CO') : 'escaneando…') + '</div></div>' +
      '<div class="gx-kpis">' +
      kpi('Ligas cargadas', 'shield-half', String(Ls.length), '9 en temporada · 5 en agosto') +
      kpi('Gates aprobados', 'shield-check', gatesOk + ' / ' + Ls.length, 'clubs-gate-1 · walk-forward') +
      kpi('Ligas con cuotas', 'coin', String(withOdds), 'Odds API · value activo') +
      kpi('Picks de clubes', 'sparkles', '0', 'nacen con gate + curate (como el Mundial)') +
      '</div>' +
      '<div class="gx-panel gx-board"><div class="gx-ph"><span class="gx-label">' + ic('trending-up') + 'Value multi-liga</span><span class="gx-ph-extra"><span class="cl-gate sh">SHADOW · aún no son picks</span></span></div>' +
      (list || '<div class="cl-empty">Escaneando el mercado…<br>El value aparece cuando hay cuotas frescas de MX, Brasil, MLS o Argentina.</div>') +
      '<div class="cl-note">Modelo vs consenso no-vig (mediana de casas). Una fila NO es una pick: las picks de clubes nacen cuando su liga apruebe el gate Y pasen el curate editorial, igual que en el Mundial. Esta vista existe para vigilar el pipeline.</div></div>';
    document.querySelectorAll('[data-vh]').forEach(function (el) {
      el.onclick = function () {
        var L = leagues().find(function (x) { return x.key === el.getAttribute('data-vl'); }); if (!L) return;
        var th = (L.table || []).find(function (t) { return t.name === el.getAttribute('data-vh'); });
        var ta = (L.table || []).find(function (t) { return t.name === el.getAttribute('data-va'); });
        if (th && ta) ckLoad(L.key, th.id, L.key, ta.id);
      };
    });
  }
  function vCal() {
    var all = [];
    leagues().forEach(function (L) { (L.upcoming || []).forEach(function (f) { all.push({ L: L, f: f }); }); });
    all.sort(function (a, b) { return new Date(a.f.utc) - new Date(b.f.utc); });
    var html = '', lastDay = '';
    all.slice(0, 60).forEach(function (x) {
      var dk = dayKey(x.f.utc);
      if (dk !== lastDay) { html += '<div class="cl-day">' + esc(dk) + '</div>'; lastDay = dk; }
      html += fxRow(x.L, x.f, true);
    });
    $('#cl-main').innerHTML =
      '<div class="gx-ohead"><h1>Calendario global</h1><div class="gx-spacer"></div><div class="gx-dim" style="font-size:11.5px">' + all.length + ' partidos programados · todas las ligas</div></div>' +
      '<div class="gx-panel gx-board">' + (html || '<div class="cl-empty">Sin partidos programados.</div>') + '</div>';
    wireFx();
  }
  function vBoard() {
    var L = lg(); if (!L) return; S.lg = L.key;
    var pills = leagues().map(function (x) { return '<button data-pg="' + esc(x.key) + '" class="' + (x.key === L.key ? 'on' : '') + '">' + esc(x.name.split(' · ')[0]) + '</button>'; }).join('');
    var fx = (L.upcoming || []).map(function (f) { return fxRow(L, f, false); }).join('');
    var emptyMsg = L.starts ? 'La temporada 26-27 arranca en ' + esc(L.starts) + '. Ratings de la 25-26 listos: entra calibrada a su kickoff.' : 'Sin partidos programados en el proveedor todavía. Se refresca cada 6 horas.';
    $('#cl-main').innerHTML =
      '<div class="gx-ohead"><h1>Cartelera</h1><div class="gx-seg" style="overflow-x:auto">' + pills + '</div></div>' +
      '<div class="gx-panel gx-board"><div class="gx-ph"><span class="gx-label">' + ic('calendar') + esc(L.name) + '</span><span class="gx-ph-extra">' + gateChip(L.gate) + ' <span style="margin-left:6px">' + (L.upcoming || []).length + ' próximos · localía +' + L.hfa + '</span></span></div>' +
      (fx || '<div class="cl-empty">' + emptyMsg + '</div>') + '</div>';
    document.querySelectorAll('[data-pg]').forEach(function (el) { el.onclick = function () { S.lg = el.getAttribute('data-pg'); paint(); }; });
    wireFx();
  }
  function vTables() {
    var L = lg(); if (!L) return; S.lg = L.key;
    var pills = leagues().map(function (x) { return '<button data-pg="' + esc(x.key) + '" class="' + (x.key === L.key ? 'on' : '') + '">' + esc(x.name.split(' · ')[0]) + '</button>'; }).join('');
    var eloById = {}; (L.table || []).forEach(function (t) { eloById[t.id] = t.elo; });
    var rows = (L.standings || []).map(function (t, i) {
      var hl = S.hlTeam && t.name === S.hlTeam ? ' hl' : '';
      return '<div class="cl-trow' + hl + '"><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(t.name) + '</span>' +
        '<span class="num">' + t.pj + '</span><span class="num">' + t.w + '-' + t.d + '-' + t.l + '</span><span class="num">' + t.gf + ':' + t.ga + '</span><span class="num b">' + t.pts + '</span><span class="num">' + (eloById[t.id] || '') + '</span></div>';
    }).join('');
    $('#cl-main').innerHTML =
      '<div class="gx-ohead"><h1>Tablas</h1><div class="gx-seg" style="overflow-x:auto">' + pills + '</div></div>' +
      '<div class="gx-panel gx-board"><div class="gx-ph"><span class="gx-label">' + ic('table') + esc(L.name) + '</span><span class="gx-ph-extra">' + gateChip(L.gate) + '</span></div>' +
      '<div class="cl-trow" style="color:var(--gx-text3);font-size:10px;font-weight:800;letter-spacing:.05em"><span class="pos">#</span><span class="nm">EQUIPO</span><span class="num">PJ</span><span class="num">W-D-L</span><span class="num">GF:GC</span><span class="num b">PTS</span><span class="num">ELO</span></div>' +
      (rows || '<div class="cl-empty">Sin resultados de la temporada todavía.</div>') + '</div>';
    document.querySelectorAll('[data-pg]').forEach(function (el) { el.onclick = function () { S.lg = el.getAttribute('data-pg'); S.hlTeam = null; paint(); }; });
    S.hlTeam = null;
  }
  function vSim() {
    var opts = leagues().map(function (L) { return '<option value="' + esc(L.key) + '">' + esc(L.name.split(' · ')[0]) + ' (' + esc(L.country) + ')</option>'; }).join('');
    $('#cl-main').innerHTML =
      '<div class="gx-ohead"><h1>Simulador</h1><div class="gx-spacer"></div><div class="gx-dim" style="font-size:11.5px">cualquier club vs cualquier club · incluso entre ligas</div></div>' +
      '<div class="gx-panel"><div class="cl-simgrid">' +
      '<div><div class="ck-lbl">Local</div><select id="sim-hl">' + opts + '</select><select id="sim-h"></select></div>' +
      '<button class="cl-simbtn" id="sim-go">Simular</button>' +
      '<div><div class="ck-lbl">Visitante</div><select id="sim-al">' + opts + '</select><select id="sim-a"></select></div>' +
      '</div><div class="cl-note">El resultado sale en el cockpit de la derecha: 1X2, xG, O/U, ambos anotan y marcadores, con el núcleo del modelo de la casa. Cruce entre ligas = cancha neutral automática con aviso de comparación aproximada.</div></div>';
    function fillTeams(selLg, selTeam) {
      var L = leagues().find(function (x) { return x.key === $(selLg).value; });
      $(selTeam).innerHTML = ((L && L.table) || []).map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('');
    }
    $('#sim-hl').onchange = function () { fillTeams('#sim-hl', '#sim-h'); };
    $('#sim-al').onchange = function () { fillTeams('#sim-al', '#sim-a'); };
    $('#sim-al').selectedIndex = 1; fillTeams('#sim-hl', '#sim-h'); fillTeams('#sim-al', '#sim-a');
    $('#sim-go').onclick = function () { ckLoad($('#sim-hl').value, $('#sim-h').value, $('#sim-al').value, $('#sim-a').value); };
  }

  function kpi(label, icon, main, sub) {
    return '<div class="gx-panel gx-kpi"><div class="gx-label">' + ic(icon) + esc(label) + '</div><div class="gx-kpi-main"><div><div class="gx-kpi-sel">' + main + '</div>' + (sub ? '<div class="gx-dim" style="font-size:11px;margin-top:3px">' + esc(sub) + '</div>' : '') + '</div></div></div>';
  }
  function fxRow(L, f, withLg) {
    var nh = f.home.known ? '' : '<span class="cl-new">NUEVO</span>', na = f.away.known ? '' : '<span class="cl-new">NUEVO</span>';
    return '<div class="cl-fx" data-fl="' + esc(L.key) + '" data-fh="' + esc(f.home.id) + '" data-fa="' + esc(f.away.id) + '">' +
      (withLg ? '<div class="cl-lg" style="margin-bottom:5px">' + esc(L.name.split(' · ')[0]) + ' · ' + esc(L.country) + '</div>' : '') +
      '<div class="cl-fx-teams"><span class="t">' + esc(f.home.name) + nh + '</span><span class="cl-fx-when">' + esc(fmtDay(f.utc)) + '</span><span class="t r">' + esc(f.away.name) + na + '</span></div>' +
      '<div class="cl-bar"><div class="h" style="width:' + (f.home.prob * 100) + '%"></div><div class="d" style="width:' + (f.draw * 100) + '%"></div><div class="a" style="width:' + (f.away.prob * 100) + '%"></div></div>' +
      '<div class="cl-pct"><b>' + pct(f.home.prob) + '</b><span>X ' + pct(f.draw) + '</span><b>' + pct(f.away.prob) + '</b></div>' +
      '</div>';
  }
  function wireFx() {
    document.querySelectorAll('.cl-fx[data-fl]').forEach(function (el) {
      el.onclick = function () {
        document.querySelectorAll('.cl-fx.on').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        ckLoad(el.getAttribute('data-fl'), el.getAttribute('data-fh'), el.getAttribute('data-fl'), el.getAttribute('data-fa'));
      };
    });
  }
  // ── BUSCADOR multi-liga (equipos de las 14 ligas) ──
  function wireSearch() {
    var inp = $('#cl-search'), res = $('#cl-search-res'); if (!inp) return;
    var norm = function (s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
    inp.oninput = function () {
      var q = norm(inp.value.trim()); if (q.length < 2) { res.hidden = true; return; }
      var hits = [];
      leagues().forEach(function (L) { (L.table || []).forEach(function (t) { if (norm(t.name).includes(q)) hits.push({ L: L, t: t }); }); });
      if (!hits.length) { res.hidden = true; return; }
      res.innerHTML = hits.slice(0, 9).map(function (h) { return '<div class="gx-sr" style="padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:12.5px" data-sl="' + esc(h.L.key) + '" data-st="' + esc(h.t.id) + '" data-sn="' + esc(h.t.name) + '"><b>' + esc(h.t.name) + '</b><span class="gx-dim">' + esc(h.L.name.split(' · ')[0]) + ' · Elo ' + h.t.elo + '</span></div>'; }).join('');
      res.hidden = false;
      res.querySelectorAll('[data-sl]').forEach(function (el) {
        el.onclick = function () {
          res.hidden = true; inp.value = '';
          var Lk = el.getAttribute('data-sl'), tid = el.getAttribute('data-st'), tn = el.getAttribute('data-sn');
          S.lg = Lk; S.view = 'tables'; S.hlTeam = tn; shell();
          var L = leagues().find(function (x) { return x.key === Lk; });
          // cockpit: el próximo partido del equipo si existe; si no, nada
          var next = ((L && L.upcoming) || []).find(function (f) { return f.home.id === tid || f.away.id === tid; });
          var hl = S.hlTeam; paint(); S.hlTeam = hl; // repinta tablas con highlight
          vTablesHighlight(tn);
          if (next) ckLoad(Lk, next.home.id, Lk, next.away.id);
        };
      });
    };
    document.addEventListener('click', function (e) { if (res && !res.contains(e.target) && e.target !== inp) res.hidden = true; });
  }
  function vTablesHighlight(name) {
    document.querySelectorAll('.cl-trow').forEach(function (r) {
      var nm = r.querySelector('.nm');
      if (nm && nm.textContent === name) { r.classList.add('hl'); r.scrollIntoView({ block: 'center' }); }
    });
  }

  function paint() {
    if (S.view === 'opps') vOpps();
    else if (S.view === 'cal') vCal();
    else if (S.view === 'tables') vTables();
    else if (S.view === 'sim') vSim();
    else vBoard();
    if (!S.ck) ckPaint();
  }

  fetch('/api/clubs/state', { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      S.data = j; shell(); paint();
      fetch('/api/clubs/value', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) { S.value = v; if (S.view === 'opps') paint(); });
    })
    .catch(function (e) { document.getElementById('gx-root').innerHTML = '<div style="padding:60px;text-align:center;color:#9DB0B5;font-family:sans-serif">No se pudo cargar (' + esc(e.message) + '). ¿Sesión de admin activa?</div>'; });
})();
</script>
</body>
</html>
