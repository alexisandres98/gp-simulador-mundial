<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Pass · GP Simulador</title>
<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-var.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: 'InterVar'; src: url('/fonts/inter-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root { --bg:#06090B; --panel:#0D1417; --panel2:#111A1E; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#EAF1F2; --tx2:#9DB0B5; --tx3:#5F747B; --ac:#1FE3A4; --acs:rgba(31,227,164,.12); --acl:rgba(31,227,164,.45);
  --amber:#FFC15E; --disp:'Space Grotesk',sans-serif; --sans:'InterVar',-apple-system,sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:15px; -webkit-font-smoothing:antialiased; overflow-x:hidden; overflow-x:clip; }
body { background:
  radial-gradient(1100px 520px at 15% -6%, rgba(31,227,164,.06), transparent 60%),
  radial-gradient(800px 420px at 100% 0%, rgba(255,193,94,.04), transparent 55%), var(--bg); }
.wrap { max-width:1060px; margin:0 auto; padding:0 22px 90px; }
.nav { display:flex; align-items:center; gap:12px; padding:22px 0; }
.logo { display:flex; align-items:center; gap:10px; font-family:var(--disp); font-weight:700; font-size:17px; }
.logo i { width:34px; height:34px; border-radius:10px; background:var(--acs); border:1px solid var(--acl); display:grid; place-items:center; font-style:normal; color:var(--ac); font-size:16px; }
.preview-chip { margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); border:1px solid rgba(255,193,94,.3); background:rgba(255,193,94,.07); padding:6px 12px; border-radius:99px; white-space:nowrap; }
.lang { display:flex; border:1px solid var(--line2); border-radius:99px; overflow:hidden; }
.lang button { background:none; border:0; color:var(--tx3); font-family:inherit; font-weight:700; font-size:12px; padding:7px 13px; cursor:pointer; }
.lang button.on { background:var(--acs); color:var(--ac); }
.hero { text-align:center; padding:44px 0 14px; }
.eyebrow { display:block; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ac); margin-bottom:16px; }
.eyebrow i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ac); box-shadow:0 0 10px rgba(31,227,164,.7); margin-right:8px; vertical-align:2px; }
h1 { font-family:var(--disp); font-size:clamp(34px,5.4vw,54px); font-weight:700; letter-spacing:-.03em; line-height:1.06; text-wrap:balance; }
h1 b { color:var(--ac); }
.sub { color:var(--tx2); font-size:16.5px; max-width:560px; margin:16px auto 0; line-height:1.55; }
.counter { display:inline-flex; align-items:center; gap:10px; margin-top:22px; border:1px solid rgba(255,193,94,.28); background:rgba(255,193,94,.06); padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:600; color:var(--tx2); }
.counter b { font-family:var(--disp); color:var(--amber); font-size:16px; white-space:nowrap; }
.plans { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:44px; align-items:stretch; }
@media (max-width:860px){ .plans { grid-template-columns:1fr; max-width:430px; margin-left:auto; margin-right:auto; } }
.plan { display:flex; flex-direction:column; background:linear-gradient(165deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:18px; padding:26px 24px; position:relative; }
.plan.hl { border-color:var(--acl); box-shadow:0 0 0 1px var(--acl), 0 24px 60px -30px rgba(31,227,164,.25); }
.plan.hl::before { content:attr(data-badge); position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--ac); color:#06231A; font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:5px 14px; border-radius:99px; white-space:nowrap; }
.pname { font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--tx2); }
.plan.hl .pname { color:var(--ac); }
.price { display:flex; align-items:baseline; gap:8px; margin-top:14px; }
.price .n { font-family:var(--disp); font-weight:700; font-size:40px; letter-spacing:-.02em; }
.price .per { color:var(--tx3); font-size:13px; }
.price .was { color:var(--tx3); font-size:16px; text-decoration:line-through; font-weight:600; }
.founder-note { margin-top:6px; font-size:12px; font-weight:700; color:var(--amber); }
.annual { margin-top:10px; }
.annual a, .annual span.na { display:flex; align-items:center; justify-content:center; gap:8px; border:1px dashed rgba(255,193,94,.45); background:rgba(255,193,94,.07); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:700; color:var(--amber) !important; text-decoration:none; transition:background .15s; }
.annual a:hover { background:rgba(255,193,94,.14); }
.annual .save { background:var(--amber); color:#231803; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:99px; }
.feats { list-style:none; margin-top:20px; display:flex; flex-direction:column; gap:11px; flex:1; }
.feats li { display:flex; gap:10px; font-size:13.5px; color:var(--tx2); line-height:1.45; }
.feats li.on { color:var(--tx); }
.feats li.soon b::after { content:''; }
.feats i { flex:none; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:10px; margin-top:1px; }
.feats li.on i { background:var(--acs); color:var(--ac); border:1px solid var(--acl); }
.feats li.off i { background:rgba(255,255,255,.05); color:var(--tx3); border:1px solid var(--line); }
.soon-tag { display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--amber); border:1px solid rgba(255,193,94,.3); border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px; }
.pcta { margin-top:22px; width:100%; border:0; border-radius:12px; font-family:inherit; font-weight:800; font-size:14.5px; padding:14px; cursor:not-allowed; display:block; text-align:center; text-decoration:none; box-sizing:border-box; }
.plan .pcta { background:rgba(255,255,255,.06); color:var(--tx3); border:1px solid var(--line2); }
.plan.hl .pcta { background:var(--ac); color:#06231A; opacity:.55; }
.pcta.live { cursor:pointer; background:var(--ac); color:#06231A; opacity:1; border:0; transition:transform .12s, filter .12s; }
.pcta.live:hover { transform:translateY(-1px); filter:brightness(1.06); }
.plan:not(.hl) .pcta.live { background:rgba(31,227,164,.14); color:var(--ac); border:1px solid var(--acl); }
.annual a { color:var(--tx2); }
.pcta-note { text-align:center; margin-top:9px; font-size:11px; color:var(--tx3); }
.faq { margin-top:70px; }
.faq h2 { font-family:var(--disp); font-size:24px; font-weight:700; letter-spacing:-.02em; text-align:center; }
.qs { max-width:640px; margin:26px auto 0; display:flex; flex-direction:column; gap:10px; }
details { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 18px; }
summary { cursor:pointer; font-weight:700; font-size:14px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
summary::after { content:'+'; color:var(--tx3); font-size:18px; font-weight:400; }
details[open] summary::after { content:'–'; }
details p { margin-top:10px; color:var(--tx2); font-size:13.5px; line-height:1.6; }
.foot { margin-top:70px; text-align:center; color:var(--tx3); font-size:12px; line-height:1.7; }
.foot a { color:var(--tx3); }
</style>
</head>
<body>
