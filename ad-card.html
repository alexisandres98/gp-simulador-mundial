<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #07271B 0%, #0A5C3C 50%, #0BA661 100%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 80px; overflow: hidden; position: relative; }
.live { position: absolute; left: 80px; top: 70px; background: rgba(229,72,77,.95); font-weight: 800;
  font-size: 26px; padding: 14px 28px; border-radius: 99px; letter-spacing: 1.5px; }
.brand { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; margin-top: 70px; }
.badge { width: 70px; height: 70px; border-radius: 20px; background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid rgba(255,255,255,.25); }
.bname { font-size: 33px; font-weight: 800; letter-spacing: -.5px; }
.match { display: flex; align-items: center; justify-content: center; gap: 40px; margin: 10px 0 36px; }
.team { text-align: center; }
.team .f { font-size: 110px; line-height: 1; }
.team .n { font-size: 34px; font-weight: 800; margin-top: 10px; }
.vs { font-size: 42px; font-weight: 800; color: #A7E8C8; }
h1 { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; text-align: center; margin-bottom: 40px; }
h1 .big { font-size: 120px; display: block; letter-spacing: -3px; margin-top: 6px; }
.probs { display: flex; gap: 16px; margin-bottom: 50px; }
.pb { flex: 1; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 22px; text-align: center; }
.pb .v { font-size: 44px; font-weight: 800; }
.pb .l { font-size: 21px; color: #C9F2DE; font-weight: 600; margin-top: 4px; }
.cta { background: #fff; color: #067647; font-size: 34px; font-weight: 800; padding: 26px; border-radius: 99px; text-align: center; }
.foot { margin-top: 20px; text-align: center; font-size: 23px; color: #A7E8C8; font-weight: 600; }
</style></head>
<body>
  <div class="live">● HOY · PARTIDO INAUGURAL</div>
  <div class="brand">
    <div class="badge">⚽</div>
    <div class="bname">GP Simulador del Mundial</div>
  </div>
  <div class="match">
    <div class="team"><div class="f">🇲🇽</div><div class="n">México</div></div>
    <div class="vs">VS</div>
    <div class="team"><div class="f">🇿🇦</div><div class="n">Sudáfrica</div></div>
  </div>
  <h1>Probabilidad de que México gane hoy:<span class="big">85.6%</span></h1>
  <div class="probs">
    <div class="pb"><div class="v">85.6%</div><div class="l">Gana México</div></div>
    <div class="pb"><div class="v">11.9%</div><div class="l">Empate</div></div>
    <div class="pb"><div class="v">2.6%</div><div class="l">Gana Sudáfrica</div></div>
  </div>
  <div class="cta">Míralas moverse EN VIVO → gpsimulador.com</div>
  <div class="foot">10,000 torneos simulados · los 48 equipos · gratis con tu email</div>
</body></html>
