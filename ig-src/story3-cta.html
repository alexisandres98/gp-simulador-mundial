<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: radial-gradient(circle at 30% 20%, #0BA661 0%, #0A5C3C 50%, #07271B 100%); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 90px; position: relative; text-align: center; }
.ball { font-size: 150px; margin-bottom: 30px; filter: drop-shadow(0 14px 30px rgba(0,0,0,.35)); }
h1 { font-size: 84px; font-weight: 800; letter-spacing: -2.5px; line-height: 1.08; margin-bottom: 34px; }
h1 span { color: #7CF2BC; }
.sub { font-size: 36px; color: #C9F2DE; font-weight: 600; line-height: 1.45; margin-bottom: 70px; }
.steps { text-align: left; font-size: 34px; font-weight: 700; line-height: 2.1; margin-bottom: 80px; }
.steps span { color: #7CF2BC; font-weight: 800; margin-right: 14px; }
.cta { background: #fff; color: #067647; font-size: 40px; font-weight: 800; padding: 34px 70px; border-radius: 99px; }
.hint { margin-top: 28px; font-size: 26px; color: #C9F2DE; font-weight: 600; }
</style></head>
<body>
  <div class="ball">⚽</div>
  <h1>Las probabilidades<br>se mueven <span>EN VIVO</span></h1>
  <div class="sub">Cada gol cambia el destino de los 48 equipos.<br>Nosotros lo calculamos en tiempo real.</div>
  <div class="steps">
    <div><span>1.</span>Entra a gpsimulador.com</div>
    <div><span>2.</span>Pon tu email (sin contraseñas)</div>
    <div><span>3.</span>Mira quién va a ganar el Mundial</div>
  </div>
  <div class="cta">Es gratis →</div>
  <div class="hint">⬆ link en bio</div>
</body></html>
