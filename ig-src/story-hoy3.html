<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(175deg, #1A1230 0%, #1E2A5C 50%, #0BA661 130%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 90px; position: relative; }
.brand { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; }
.tag { align-self: center; background: rgba(124,242,188,.95); color: #07271B; font-weight: 800; font-size: 28px;
  padding: 15px 34px; border-radius: 99px; margin-bottom: 56px; letter-spacing: 2px; }
h1 { text-align: center; font-size: 68px; font-weight: 800; letter-spacing: -2px; margin-bottom: 64px; }
.m { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2); border-radius: 24px;
  padding: 36px 40px; margin-bottom: 32px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.mh .teams { font-size: 34px; font-weight: 800; }
.mh .time { font-size: 21px; color: #C9D6F2; font-weight: 600; }
.bar { display: flex; height: 26px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 18px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.4); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 25px; font-weight: 700; }
.lbl .big { font-size: 30px; font-weight: 800; }
.cta { position: absolute; bottom: 130px; left: 90px; right: 90px; background: #fff; color: #1E2A5C;
  font-size: 36px; font-weight: 800; padding: 30px; border-radius: 99px; text-align: center; }
.hint { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; font-size: 25px; color: #C9D6F2; font-weight: 600; }
</style></head>
<body>
  <div class="brand">⚽ GP Simulador del Mundial</div>
  <div class="tag">● CIERRE DE JORNADA</div>
  <h1>Los dos últimos 🌙</h1>
  <div class="m">
    <div class="mh"><div class="teams">🇭🇹 Haití vs Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿</div><div class="time">9 PM ET</div></div>
    <div class="bar"><div class="h" style="width:9.1%"></div><div class="d" style="width:18.1%"></div><div class="a" style="width:72.8%"></div></div>
    <div class="lbl"><span>Haití 9.1%</span><span>X 18.1%</span><span class="big">🏴󠁧󠁢󠁳󠁣󠁴󠁿 72.8%</span></div>
  </div>
  <div class="m">
    <div class="mh"><div class="teams">🇦🇺 Australia vs Turquía 🇹🇷</div><div class="time">12 AM ET</div></div>
    <div class="bar"><div class="h" style="width:18.3%"></div><div class="d" style="width:22.7%"></div><div class="a" style="width:59%"></div></div>
    <div class="lbl"><span>Australia 18.3%</span><span>X 22.7%</span><span class="big">🇹🇷 59%</span></div>
  </div>
  <div class="cta">Míralas EN VIVO → gpsimulador.com</div>
  <div class="hint">⬆ link en bio</div>
</body></html>
