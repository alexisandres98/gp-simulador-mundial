<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #1A1230 0%, #1E2A5C 50%, #0BA661 130%); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding: 72px; position: relative; }
.brand { position: absolute; top: 60px; left: 72px; display: flex; align-items: center; gap: 12px; }
.badge { width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; font-size: 25px; border: 1px solid rgba(255,255,255,.25); }
.bname { font-size: 23px; font-weight: 800; }
.tag { position: absolute; top: 66px; right: 72px; background: rgba(124,242,188,.95); color: #07271B; font-weight: 800;
  font-size: 17px; padding: 11px 22px; border-radius: 99px; letter-spacing: 1.5px; }
h1 { font-size: 54px; font-weight: 800; letter-spacing: -1.5px; margin: 40px 0 34px; }
.m { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2); border-radius: 22px;
  padding: 30px 34px; margin-bottom: 22px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.mh .teams { font-size: 32px; font-weight: 800; }
.mh .time { font-size: 18px; color: #C9D6F2; font-weight: 600; }
.bar { display: flex; height: 22px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.14); margin-bottom: 14px; }
.bar .h { background: #7CF2BC; } .bar .d { background: rgba(255,255,255,.4); } .bar .a { background: #5FA8FF; }
.lbl { display: flex; justify-content: space-between; font-size: 21px; font-weight: 700; }
.lbl .big { font-size: 25px; font-weight: 800; }
.foot { position: absolute; bottom: 56px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; }
.cta { background: #fff; color: #1E2A5C; font-size: 23px; font-weight: 800; padding: 17px 34px; border-radius: 99px; }
.foot .small { font-size: 19px; color: #C9D6F2; font-weight: 600; }
</style></head>
<body>
  <div class="brand"><div class="badge">⚽</div><div class="bname">GP Simulador del Mundial</div></div>
  <div class="tag">● CIERRE DE JORNADA</div>
  <h1>Los dos últimos de hoy 🌙</h1>
  <div class="m">
    <div class="mh"><div class="teams">🇭🇹 Haití vs Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿</div><div class="time">9:00 PM ET</div></div>
    <div class="bar"><div class="h" style="width:9.1%"></div><div class="d" style="width:18.1%"></div><div class="a" style="width:72.8%"></div></div>
    <div class="lbl"><span>Haití 9.1%</span><span>empate 18.1%</span><span class="big">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Escocia 72.8%</span></div>
  </div>
  <div class="m">
    <div class="mh"><div class="teams">🇦🇺 Australia vs Turquía 🇹🇷</div><div class="time">12:00 AM ET</div></div>
    <div class="bar"><div class="h" style="width:18.3%"></div><div class="d" style="width:22.7%"></div><div class="a" style="width:59%"></div></div>
    <div class="lbl"><span>Australia 18.3%</span><span>empate 22.7%</span><span class="big">🇹🇷 Turquía 59%</span></div>
  </div>
  <div class="foot">
    <div class="small">Probabilidades que se mueven con cada gol</div>
    <div class="cta">gpsimulador.com</div>
  </div>
</body></html>
